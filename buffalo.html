<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Young Buffalo Song — HuluBet</title>
<script src="/game-bridge.js"></script>
<style>
  :root {
    --bg-dark: #100c14;
    --panel-bg: #171c26;
    --panel-card: #1e2431;
    --border-gold: #d99b38;
    --gold-bright: #ffd35c;
    --accent-blue: #3f9bff;
    --text-main: #f4f7fb;
    --text-muted: #8c9bb3;
    --parchment-light: #fbf1d6;
    --parchment-dark: #ecd7ad;
    --reel-divider: #c79f61;
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #09070b;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--text-main);
    overflow: hidden;
  }

  /* Desktop wrapper centers a sleek mobile-first cabinet */
  .viewport-wrap {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 35%, #2a1820 0%, #09070b 75%);
  }

  .game-shell {
    position: relative;
    width: 100%;
    max-width: 450px;
    height: 100%;
    max-height: 920px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 25px 70px rgba(0,0,0,0.85);
    background: linear-gradient(180deg,
      #467387 0%,
      #789ba1 16%,
      #d6b88e 31%,
      #a84b2e 45%,
      #6b1012 68%,
      #3b060a 88%,
      #090709 100%
    );
  }

  @media (min-width: 500px) and (min-height: 760px) {
    .game-shell {
      height: 94vh;
      border-radius: 26px;
      border: 2px solid rgba(255, 200, 100, 0.25);
    }
  }

  /* Scenic clouds & prairie floor SVG layer */
  .scenic-bg {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }

  /* Top status bar */
  .top-header {
    position: relative;
    z-index: 5;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 14px 4px;
    font-size: 12px;
    font-weight: 600;
    color: rgba(255,255,255,0.88);
    text-shadow: 0 1px 3px rgba(0,0,0,0.6);
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .btn-back-pill {
    border: 1px solid rgba(255, 255, 255, 0.24);
    background: rgba(15, 10, 12, 0.45);
    color: #fff;
    border-radius: 999px;
    padding: 3px 10px;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .btn-back-pill:active { transform: scale(0.95); }

  /* Mode banner (Free Spins / Bonus Game) */
  .mode-banner {
    position: relative;
    z-index: 6;
    margin: 2px auto 0;
    padding: 4px 14px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.7px;
    text-transform: uppercase;
    background: linear-gradient(90deg, #4b1d78, #8e24aa, #4b1d78);
    border: 1px solid #f6c75e;
    color: #fff;
    box-shadow: 0 4px 14px rgba(0,0,0,0.5);
    display: none;
    align-items: center;
    gap: 10px;
  }
  .mode-banner.bonus-mode {
    background: linear-gradient(90deg, #8b4200, #d47b00, #8b4200);
  }
  .mode-banner.active {
    display: inline-flex;
  }

  /* Main stage area */
  .stage-area {
    position: relative;
    z-index: 4;
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 4px 6px 0;
    min-height: 0;
  }

  /* Jackpot Header Row */
  .jackpot-bar {
    position: relative;
    display: grid;
    grid-template-columns: 1fr 1fr 1.25fr 1fr 1fr;
    align-items: end;
    gap: 3px;
    padding: 0 4px;
    margin-bottom: -2px;
    z-index: 7;
  }

  .jp-box {
    border-radius: 6px 6px 2px 2px;
    border: 1.5px solid #e5a942;
    text-align: center;
    padding: 2px 2px 3px;
    background: #10203a;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.25), 0 3px 6px rgba(0,0,0,0.6);
  }
  .jp-box.mini { background: linear-gradient(180deg, #1b65a6, #0d3257); }
  .jp-box.mega { background: linear-gradient(180deg, #1b7844, #0b3c21); }
  .jp-box.super { background: linear-gradient(180deg, #6b268e, #330d49); }
  .jp-box.grand { background: linear-gradient(180deg, #a6251b, #4f0a06); }

  .jp-label {
    font-size: 9px;
    font-weight: 900;
    letter-spacing: 0.6px;
    color: #ffd86f;
    text-shadow: 0 1px 2px #000;
    line-height: 1.1;
  }
  .jp-val {
    font-size: 11px;
    font-weight: 800;
    color: #fff;
    text-shadow: 0 1px 2px #000;
    line-height: 1.15;
    font-variant-numeric: tabular-nums;
  }

  .logo-crest {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 4px 2px 2px;
    margin-bottom: -4px;
    background: radial-gradient(ellipse at center, #78260e 0%, #3d0f04 80%);
    border: 2px solid #f0b84b;
    border-radius: 12px 12px 4px 4px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.75);
  }
  .logo-feathers {
    position: absolute;
    top: -11px;
    display: flex;
    gap: 2px;
  }
  .logo-feathers span {
    width: 5px;
    height: 11px;
    border-radius: 50% 50% 0 0;
    background: linear-gradient(180deg, #ff5f38, #f2b749);
    border: 1px solid #4a1506;
    transform-origin: bottom center;
  }
  .logo-feathers span:nth-child(1) { transform: rotate(-28deg); }
  .logo-feathers span:nth-child(2) { transform: rotate(-14deg); height: 13px; }
  .logo-feathers span:nth-child(3) { height: 14px; }
  .logo-feathers span:nth-child(4) { transform: rotate(14deg); height: 13px; }
  .logo-feathers span:nth-child(5) { transform: rotate(28deg); }

  .logo-small {
    font-size: 7.5px;
    font-weight: 900;
    letter-spacing: 1px;
    color: #ffe8a3;
    line-height: 1;
  }
  .logo-big {
    font-size: 11.5px;
    font-weight: 900;
    letter-spacing: 0.4px;
    background: linear-gradient(180deg, #fff5bf 0%, #ffc43d 55%, #d66c00 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 1px 1px #000);
    line-height: 1.05;
  }
  .logo-sub {
    font-size: 9px;
    font-weight: 900;
    color: #ffcf5c;
    letter-spacing: 1.5px;
    line-height: 1;
  }

  /* Reel Cabinet Frame */
  .reel-frame {
    position: relative;
    background: linear-gradient(180deg, #b85b1c, #7c3209);
    padding: 6px;
    border-radius: 8px;
    border: 2.5px solid #f0b74c;
    box-shadow: 0 12px 28px rgba(0,0,0,0.7), inset 0 0 8px rgba(0,0,0,0.6);
  }

  .reel-board {
    position: relative;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 2px;
    background: #875c2b;
    border-radius: 4px;
    overflow: hidden;
    aspect-ratio: 5 / 4;
    width: 100%;
  }

  .reel-col {
    position: relative;
    display: grid;
    grid-template-rows: repeat(4, 1fr);
    background: linear-gradient(180deg, var(--parchment-dark) 0%, var(--parchment-light) 22%, var(--parchment-light) 78%, var(--parchment-dark) 100%);
    overflow: hidden;
  }

  .reel-col.spinning .cell-inner {
    animation: reelBlurSpin 0.14s linear infinite;
  }

  @keyframes reelBlurSpin {
    0% { transform: translateY(-28%); filter: blur(1.4px); opacity: 0.85; }
    50% { transform: translateY(28%); filter: blur(1.8px); opacity: 0.9; }
    100% { transform: translateY(-28%); filter: blur(1.4px); opacity: 0.85; }
  }

  @keyframes reelBounce {
    0% { transform: translateY(-14%); }
    60% { transform: translateY(5%); }
    100% { transform: translateY(0); }
  }
  .reel-col.landed .cell-inner {
    animation: reelBounce 0.22s ease-out;
  }

  .symbol-cell {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 3px;
    overflow: hidden;
  }

  .cell-inner {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .symbol-cell.win-highlight {
    z-index: 3;
  }
  .symbol-cell.win-highlight::after {
    content: "";
    position: absolute;
    inset: 2px;
    border-radius: 8px;
    border: 2.5px solid #ffe14f;
    box-shadow: 0 0 12px #ffae00, inset 0 0 10px rgba(255, 215, 0, 0.45);
    animation: pulseWin 0.7s ease-in-out infinite alternate;
    pointer-events: none;
  }
  .symbol-cell.dimmed {
    opacity: 0.42;
    transition: opacity 0.2s;
  }
  @keyframes pulseWin {
    from { transform: scale(0.97); opacity: 0.85; }
    to { transform: scale(1.02); opacity: 1; }
  }

  /* Bonus Hold & Win locked cell overlay */
  .symbol-cell.bonus-locked {
    background: radial-gradient(circle, rgba(255,196,46,0.22), transparent 75%);
  }
  .symbol-cell.respin-spinning .cell-inner {
    animation: reelBlurSpin 0.13s linear infinite;
  }

  .bonus-empty-slot {
    width: 82%;
    height: 82%;
    border-radius: 50%;
    border: 2px dashed rgba(155, 110, 48, 0.35);
    background: rgba(120, 82, 30, 0.08);
  }

  /* SVG Payline overlay */
  .payline-svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 6;
  }

  /* Wild Multiplier Badge */
  .wild-mult-badge {
    position: absolute;
    top: 3px;
    right: 3px;
    background: linear-gradient(180deg, #ff5924, #b00000);
    border: 1.5px solid #ffe46b;
    color: #fff;
    font-size: 11px;
    font-weight: 900;
    padding: 1px 5px;
    border-radius: 999px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.65);
    z-index: 4;
    line-height: 1.1;
  }

  /* Bonus Coin Text */
  .bonus-coin-wrap {
    position: relative;
    width: 92%;
    height: 92%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .bonus-coin-label {
    position: absolute;
    font-weight: 900;
    color: #fffdf0;
    text-shadow: 0 1.5px 2px #5c1900, 0 0 4px #3b0d00;
    letter-spacing: -0.3px;
    text-align: center;
    pointer-events: none;
  }

  /* Win Ticker Banner */
  .win-ticker {
    min-height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 6px;
    font-size: 13px;
    font-weight: 800;
    color: #ffe382;
    text-shadow: 0 2px 5px rgba(0,0,0,0.85);
    text-align: center;
  }
  .win-ticker .win-pill {
    background: rgba(20, 8, 8, 0.72);
    border: 1px solid rgba(255, 208, 92, 0.55);
    padding: 3px 14px;
    border-radius: 999px;
    animation: popIn 0.25s ease-out;
  }
  .win-ticker .err-pill {
    background: rgba(120, 14, 24, 0.85);
    border: 1px solid rgba(255, 110, 120, 0.65);
    color: #ffdce0;
    padding: 3px 14px;
    border-radius: 999px;
    animation: popIn 0.25s ease-out;
  }
  @keyframes popIn {
    from { transform: scale(0.85); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  /* Bonus Buy Button row */
  .bonus-buy-row {
    position: relative;
    z-index: 5;
    display: flex;
    justify-content: flex-end;
    padding: 4px 16px 6px;
  }
  .btn-bonus-buy {
    background: #ffffff;
    color: #11151d;
    border: none;
    border-radius: 999px;
    padding: 9px 18px;
    font-size: 11.5px;
    font-weight: 900;
    letter-spacing: 0.4px;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(0,0,0,0.45);
    transition: transform 0.12s, opacity 0.15s;
  }
  .btn-bonus-buy:active { transform: scale(0.95); }
  .btn-bonus-buy:disabled { opacity: 0.45; cursor: not-allowed; }

  /* Spin Controls Row */
  .controls-row {
    position: relative;
    z-index: 5;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 24px;
    padding: 4px 16px 10px;
  }

  .btn-icon {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: none;
    background: rgba(255,255,255,0.08);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    position: relative;
    transition: background 0.15s, transform 0.12s;
  }
  .btn-icon:hover { background: rgba(255,255,255,0.16); }
  .btn-icon:active { transform: scale(0.92); }
  .btn-icon.active-speed {
    color: #ffd35c;
    background: rgba(255, 211, 92, 0.18);
    box-shadow: 0 0 10px rgba(255, 211, 92, 0.3);
  }
  .speed-tag {
    position: absolute;
    bottom: -4px;
    font-size: 8px;
    font-weight: 900;
    background: #ffd35c;
    color: #111;
    padding: 0 4px;
    border-radius: 4px;
    display: none;
  }
  .btn-icon.active-speed .speed-tag { display: block; }

  .btn-spin {
    width: 78px;
    height: 78px;
    border-radius: 50%;
    border: none;
    background: #ffffff;
    color: #16181f;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 6px 24px rgba(0,0,0,0.55);
    transition: transform 0.12s, background 0.15s;
    position: relative;
  }
  .btn-spin:active { transform: scale(0.94); }
  .btn-spin.spinning svg { animation: spinRotate 0.7s linear infinite; }
  .btn-spin.free-spin-btn {
    background: linear-gradient(135deg, #b858ff, #6c11cb);
    color: #fff;
    border: 2px solid #ffd35c;
  }
  .btn-spin.bonus-spin-btn {
    background: linear-gradient(135deg, #ffb42b, #c95800);
    color: #fff;
    border: 2px solid #fff0b3;
  }
  @keyframes spinRotate {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  .spin-counter {
    font-size: 20px;
    font-weight: 900;
    line-height: 1;
  }
  .spin-subtext {
    font-size: 8px;
    font-weight: 800;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  /* Bottom Bar */
  .bottom-bar {
    position: relative;
    z-index: 5;
    display: grid;
    grid-template-columns: auto auto 1fr auto;
    align-items: center;
    gap: 8px;
    padding: 8px 12px 14px;
    background: linear-gradient(180deg, rgba(0,0,0,0.15), rgba(0,0,0,0.92));
  }

  .btn-bare {
    width: 36px;
    height: 36px;
    border: none;
    background: transparent;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    border-radius: 8px;
  }
  .btn-bare:active { background: rgba(255,255,255,0.1); }

  .bet-pill {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 999px;
    padding: 4px 6px;
    max-width: 185px;
    margin: 0 auto;
    width: 100%;
  }
  .bet-step {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: none;
    background: rgba(255,255,255,0.08);
    color: #fff;
    font-size: 18px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .bet-step:active { background: rgba(255,255,255,0.2); }
  .bet-step:disabled { opacity: 0.35; cursor: not-allowed; }
  .bet-info {
    text-align: center;
    padding: 0 4px;
  }
  .bet-label {
    font-size: 9px;
    color: var(--text-muted);
    font-weight: 700;
    letter-spacing: 0.6px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 3px;
  }
  .bet-val {
    font-size: 11.5px;
    font-weight: 800;
    color: #fff;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }

  .balance-box {
    text-align: right;
  }
  .bal-label {
    font-size: 9px;
    color: var(--text-muted);
    font-weight: 700;
    letter-spacing: 0.6px;
  }
  .bal-val {
    font-size: 11.5px;
    font-weight: 800;
    color: #fff;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }

  /* Big Win / Feature Splash Overlay */
  .splash-overlay {
    position: absolute;
    inset: 0;
    z-index: 40;
    background: rgba(8, 5, 12, 0.84);
    backdrop-filter: blur(4px);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    cursor: pointer;
  }
  .splash-overlay.active {
    display: flex;
    animation: fadeIn 0.25s ease-out;
  }
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  .splash-title {
    font-size: 30px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    background: linear-gradient(180deg, #fff6c9 0%, #ffc83b 50%, #e06d00 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 4px 12px rgba(255, 166, 0, 0.55));
    margin-bottom: 8px;
  }
  .splash-subtitle {
    font-size: 14px;
    font-weight: 700;
    color: #e6ecf5;
    margin-bottom: 14px;
  }
  .splash-amount {
    font-size: 34px;
    font-weight: 900;
    color: #fff;
    text-shadow: 0 0 24px rgba(255, 200, 60, 0.85);
    font-variant-numeric: tabular-nums;
  }
  .splash-hint {
    margin-top: 22px;
    font-size: 11px;
    color: #b7c2d4;
    letter-spacing: 0.8px;
    text-transform: uppercase;
  }

  /* Full-Screen Menu Overlay (Paytable, Rules, History, Settings) */
  .menu-overlay {
    position: absolute;
    inset: 0;
    z-index: 50;
    background: #10141c;
    display: none;
    flex-direction: column;
  }
  .menu-overlay.active {
    display: flex;
    animation: slideUp 0.22s ease-out;
  }
  @keyframes slideUp {
    from { transform: translateY(20px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }

  .menu-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px 10px;
    background: #171d28;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .menu-header-spacer { width: 42px; font-size: 12px; color: var(--text-muted); }
  .menu-title-wrap { text-align: center; }
  .menu-title { font-size: 17px; font-weight: 700; color: #fff; }
  .menu-sub { font-size: 11px; color: #b7c4d6; margin-top: 2px; }
  .menu-close {
    width: 34px;
    height: 34px;
    border: none;
    background: transparent;
    color: var(--accent-blue);
    font-size: 26px;
    font-weight: 700;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: flex-end;
  }

  .menu-body {
    flex: 1;
    overflow-y: auto;
    padding: 14px 14px 24px;
  }
  .menu-body::-webkit-scrollbar { width: 4px; }
  .menu-body::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.18); border-radius: 4px; }

  .menu-section-title {
    font-size: 16px;
    font-weight: 800;
    letter-spacing: 0.4px;
    color: #fff;
    margin: 14px 0 10px;
    text-transform: uppercase;
  }
  .menu-section-title:first-child { margin-top: 2px; }

  .menu-card {
    background: #19202c;
    border-radius: 10px;
    padding: 16px;
    border: 1px solid rgba(255,255,255,0.06);
    margin-bottom: 14px;
  }
  .menu-card p {
    margin: 0 0 8px;
    font-size: 13.5px;
    line-height: 1.48;
    color: #8f9eb3;
  }
  .menu-card p:last-child { margin-bottom: 0; }

  .payout-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px 12px;
  }
  .payout-item {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .payout-icon {
    width: 58px;
    height: 58px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #faf0d4;

  /* =========================================================================
     3. SYNTHESIZED WEB AUDIO API SOUND EFFECTS
     ========================================================================= */
  const SoundFX = (() => {
    let ctx = null;
    function getCtx() {
      if (!state.soundOn) return null;
      if (!ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) ctx = new AC();
      }
      if (ctx && ctx.state === "suspended") ctx.resume();
      return ctx;
    }

    function tone(freq, dur, type = "sine", vol = 0.08, delay = 0) {
      const c = getCtx();
      if (!c) return;
      const now = c.currentTime + delay;
      const osc = c.createOscillator();
      const gain = c.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, now);
      gain.gain.setValueAtTime(vol, now);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);
      osc.connect(gain);
      gain.connect(c.destination);
      osc.start(now);
      osc.stop(now + dur);
    }

    return {
      click: () => tone(540, 0.05, "triangle", 0.05),
      spinStart: () => {
        tone(240, 0.08, "triangle", 0.07, 0);
        tone(360, 0.1, "triangle", 0.06, 0.05);
      },
      reelStop: (idx) => tone(150 + idx * 28, 0.07, "sine", 0.08),
      winSmall: () => {
        [523.25, 659.25, 783.99].forEach((f, i) => tone(f, 0.16, "triangle", 0.08, i * 0.07));
      },
      winBig: () => {
        [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach((f, i) => tone(f, 0.25, "sawtooth", 0.06, i * 0.08));
      },
      featureTrigger: () => {
        [392, 523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, 0.3, "triangle", 0.1, i * 0.09));
      },
      coinLand: () => tone(980, 0.12, "sine", 0.09)
    };
  })();

  function buildBoardDOM() {
    for (let c = 0; c < COLS; c++) {
      const colEl = document.createElement("div");
      colEl.className = "reel-col";
      for (let r = 0; r < ROWS; r++) {
        const cell = document.createElement("div");
        cell.className = "symbol-cell";
        cell.innerHTML = `<div class="cell-inner"></div>`;
        colEl.appendChild(cell);
        cellEls[c][r] = cell;
      }
      reelBoard.insertBefore(colEl, paylineSvg);
      reelColEls.push(colEl);
    }
  }

  function renderCell(c, r, cellData, isBonusEmpty = false) {
    const cellEl = cellEls[c][r];
    const inner = cellEl.querySelector(".cell-inner");
    cellEl.classList.remove("win-highlight", "dimmed", "bonus-locked");

    if (isBonusEmpty) {
      inner.innerHTML = `<div class="bonus-empty-slot"></div>`;
      return;
    }

    if (cellData.id === "bonus") {
      const lbl = cellData.coinLabel || "";
      const fs = lbl.length >= 4 ? "11.5px" : "15px";
      inner.innerHTML = `
        <div class="bonus-coin-wrap">
          ${getSymbolSVG("bonus")}
          <div class="bonus-coin-label" style="font-size:${fs}">${lbl}</div>
        </div>`;
    } else if (cellData.id === "wild" && cellData.mult >= 2) {
      inner.innerHTML = `${getSymbolSVG("wild")}<div class="wild-mult-badge">x${cellData.mult}</div>`;
    } else {
      inner.innerHTML = getSymbolSVG(cellData.id);
    }
  }

  function renderGrid(grid) {
    for (let c = 0; c < COLS; c++) {
      for (let r = 0; r < ROWS; r++) {
        renderCell(c, r, grid[c][r]);
      }
    }
  }

  function renderBonusGrid(bGrid) {
    for (let c = 0; c < COLS; c++) {
      for (let r = 0; r < ROWS; r++) {
        if (bGrid[c][r]) {
          renderCell(c, r, bGrid[c][r], false);
          cellEls[c][r].classList.add("bonus-locked");
        } else {
          renderCell(c, r, null, true);
        }

  function formatJackpotBadge(v) {
    if (v >= 1000000) return (v / 1000000).toFixed(v % 1000000 === 0 ? 0 : 1) + "M";
    if (v >= 100000) return Math.round(v / 1000) + "K";
    return Math.round(v).toLocaleString("en-US");

    betValDisplay.textContent = fmtMoney(bet);

    document.getElementById("jpMini").textContent = formatJackpotBadge(bet * JACKPOTS.MINI);
    document.getElementById("jpMega").textContent = formatJackpotBadge(bet * JACKPOTS.MEGA);
    document.getElementById("jpSuper").textContent = formatJackpotBadge(bet * JACKPOTS.SUPER);
    document.getElementById("jpGrand").textContent = formatJackpotBadge(bet * JACKPOTS.GRAND);

    const lockedUI = state.spinning || state.mode !== "main" || state.autospinLeft > 0;
    btnBetDec.disabled = lockedUI || state.betIndex === 0;
    btnBetInc.disabled = lockedUI || state.betIndex === BET_STEPS.length - 1;
    btnBonusBuy.disabled = state.spinning || state.mode !== "main" || state.autospinLeft > 0;

    btnSpeed.classList.toggle("active-speed", state.speedMode > 0);
    speedTag.textContent = state.speedMode === 1 ? "TURBO" : state.speedMode === 2 ? "EXTRA" : "";

  /* =========================================================================
     7. PAYLINE & WIN VISUALIZATION
     ========================================================================= */
  let paylineCycleTimer = null;

  function clearWinHighlights() {
    if (paylineCycleTimer) {
      clearInterval(paylineCycleTimer);
      paylineCycleTimer = null;
    }
    paylineSvg.innerHTML = "";
    for (let c = 0; c < COLS; c++) {
      for (let r = 0; r < ROWS; r++) {
        cellEls[c][r].classList.remove("win-highlight", "dimmed");
      }
    }
  }

  function drawPayline(lineIndex, color) {
    const line = PAYLINES[lineIndex];
    const pts = line.map((r, c) => `${c * 100 + 50},${r * 100 + 50}`).join(" ");
    paylineSvg.innerHTML = `
      <polyline points="${pts}" fill="none" stroke="rgba(0,0,0,0.65)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
      <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
    `;
  }

  function showWinHighlights(evalRes) {
    clearWinHighlights();
    const hasLine = evalRes.lineWins && evalRes.lineWins.length > 0;
    const hasScat = evalRes.scatterWin > 0;
    if (!hasLine && !hasScat) return;

    const highlightSet = new Set();
    if (hasLine) evalRes.lineWins.forEach(w => w.cells.forEach(([c, r]) => highlightSet.add(`${c},${r}`)));
    if (hasScat && evalRes.scatterCells) evalRes.scatterCells.forEach(([c, r]) => highlightSet.add(`${c},${r}`));

    for (let c = 0; c < COLS; c++) {
      for (let r = 0; r < ROWS; r++) {
        if (highlightSet.has(`${c},${r}`)) cellEls[c][r].classList.add("win-highlight");
        else cellEls[c][r].classList.add("dimmed");
      }
    }

    if (hasLine) {
      let idx = 0;
      const showNext = () => {
        const lw = evalRes.lineWins[idx % evalRes.lineWins.length];
        drawPayline(lw.lineIndex, LINE_COLORS[lw.lineIndex % LINE_COLORS.length]);
        idx++;
      };
      showNext();
      if (evalRes.lineWins.length > 1) {
        paylineCycleTimer = setInterval(showNext, 1100);
      }
    }
  }

        if (timer) clearTimeout(timer);
        splashOverlay.classList.remove("active");
        splashResolve = null;
        resolve();
      };
      splashResolve = close;
      if (autoCloseMs > 0) timer = setTimeout(close, autoCloseMs);
    });
  }

  splashOverlay.addEventListener("click", () => {
    if (splashResolve) splashResolve();
  });

  const sleep = (ms) => new Promise(res => setTimeout(res, ms));

  /* =========================================================================
     9. SERVER-AUTHORITATIVE SPIN, FREE SPINS & HOLD-AND-WIN PLAYBACK
     ========================================================================= */
  let autoActiveFlag = false;
  function autospinRunning() { return autoActiveFlag && state.autospinLeft > 0; }

  async function revealColumns(grid, effSpeed) {
    const baseDelay = effSpeed === 2 ? 105 : effSpeed === 1 ? 195 : 430;
    const colStagger = effSpeed === 2 ? 25 : effSpeed === 1 ? 50 : 120;

    reelColEls.forEach(col => {
      col.classList.remove("landed");
      col.classList.add("spinning");
    });

    await sleep(baseDelay);

    for (let c = 0; c < COLS; c++) {
      reelColEls[c].classList.remove("spinning");
      for (let r = 0; r < ROWS; r++) renderCell(c, r, grid[c][r]);
      reelColEls[c].classList.add("landed");
      SoundFX.reelStop(c);
      if (c < COLS - 1) await sleep(colStagger);
    }
  }

  async function playServerBonusGame(bonusData, effSpeed) {
    const prevMode = state.mode;
    state.mode = "bonus";
    state.bonusRespinsLeft = 3;
    clearWinHighlights();

    const bGrid = bonusData.initialGrid.map(col => col.map(c => (c ? { ...c } : null)));
    state.bonusGrid = bGrid;
    renderBonusGrid(bGrid);
    updateHUD();

    for (const step of bonusData.steps) {
      await sleep(effSpeed === 2 ? 240 : 560);
      state.bonusRespinsLeft = Math.max(0, state.bonusRespinsLeft - 1);
      updateHUD();

      for (let c = 0; c < COLS; c++) {
        for (let r = 0; r < ROWS; r++) {
          if (!bGrid[c][r]) cellEls[c][r].classList.add("respin-spinning");
        }
      }
      SoundFX.spinStart();
      await sleep(effSpeed === 2 ? 200 : 460);

      for (let c = 0; c < COLS; c++) {
        for (let r = 0; r < ROWS; r++) {
          cellEls[c][r].classList.remove("respin-spinning");
        }
      }

      if (step.added && step.added.length > 0) {
        step.added.forEach(item => {
          bGrid[item.c][item.r] = item.cell;
          SoundFX.coinLand();
        });
        state.bonusRespinsLeft = step.respinsLeft;
        renderBonusGrid(bGrid);
        winTicker.innerHTML = `<span class="win-pill">COIN LOCKED! RESPINS RESET TO 3 (${step.lockedCount}/20)</span>`;
        updateHUD();
      } else {
        renderBonusGrid(bGrid);
      }
    }

    const subTitle = bonusData.fullBoardGrand
      ? "FULL BOARD! GRAND JACKPOT WON!"
      : `${bonusData.lockedCount}/20 BONUS COINS COLLECTED`;

    state.mode = prevMode === "freespins" ? "freespins" : "main";
    updateHUD();
    SoundFX.winBig();
    await showSplash("BONUS GAME WIN!", subTitle, fmtMoney(bonusData.totalWin), 2900);
    winTicker.innerHTML = `<span class="win-pill">BONUS WIN: ${fmtMoney(bonusData.totalWin)}</span>`;
    return bonusData.totalWin;
  }

  async function playServerFreeSpins(fsData, bet, effSpeed) {
    state.mode = "freespins";
    state.freeSpinsLeft = fsData.initialSpins;
    state.freeSpinsTotalWin = 0;
    updateHUD();

    for (const spinItem of fsData.spins) {
      state.freeSpinsLeft = Math.max(0, state.freeSpinsLeft - 1);
      updateHUD();
      await sleep(effSpeed === 2 ? 200 : 340);

      clearWinHighlights();
      winTicker.innerHTML = "";
      btnSpin.classList.add("spinning");
      SoundFX.spinStart();

      state.grid = spinItem.grid;
      await revealColumns(spinItem.grid, effSpeed);
      btnSpin.classList.remove("spinning");

      const evalRes = spinItem.eval;
      if (evalRes.totalWin > 0) {
        state.freeSpinsTotalWin = roundMoney(state.freeSpinsTotalWin + evalRes.totalWin);
        showWinHighlights(evalRes);
        winTicker.innerHTML = `<span class="win-pill">FREE SPIN WIN: ${fmtMoney(evalRes.totalWin)}</span>`;
        SoundFX.winSmall();
      }

      if (spinItem.bonusGame) {
        SoundFX.featureTrigger();
        await showSplash("BONUS GAME!", `${evalRes.bonusCount} BONUS COINS`, "3 RESPINS AWARDED", 2000);
        const bWin = await playServerBonusGame(spinItem.bonusGame, effSpeed);
        state.freeSpinsTotalWin = roundMoney(state.freeSpinsTotalWin + bWin);
        state.mode = "freespins";
        updateHUD();
      }

      if (spinItem.extraSpins > 0) {
        state.freeSpinsLeft += spinItem.extraSpins;
        SoundFX.featureTrigger();
        winTicker.innerHTML = `<span class="win-pill">+${spinItem.extraSpins} EXTRA FREE SPINS!</span>`;
        updateHUD();
        await sleep(effSpeed === 2 ? 450 : 880);
      }

      await sleep(effSpeed === 2 ? 200 : 540);
    }

    const totalFS = fsData.totalWin;
    state.mode = "main";
    updateHUD();
    SoundFX.winBig();
    await showSplash("FREE SPINS COMPLETE", "TOTAL FEATURE WIN", fmtMoney(totalFS), 2800);
    winTicker.innerHTML = `<span class="win-pill">FREE SPINS WIN: ${fmtMoney(totalFS)}</span>`;
  }

  async function runSpin(bonusBuy = null, holdTurbo = false) {
    if (state.spinning || state.mode !== "main") return;

    const bet = currentBet();
    const cost = bonusBuy === "freespins" ? roundMoney(bet * 100)
               : bonusBuy === "bonus" ? roundMoney(bet * 80)
               : bet;

    if (state.balance < cost) {
      state.autospinLeft = 0;
      autoActiveFlag = false;
      updateHUD();
      winTicker.innerHTML = `<span class="err-pill">Insufficient balance (need ${fmtMoney(cost)})</span>`;
      postParent({ type: "OPEN_DEPOSIT" });
      return;
    }

    state.spinning = true;
    clearWinHighlights();
    winTicker.innerHTML = "";
    updateHUD();
    btnSpin.classList.add("spinning");
    postParent({ type: "BET_STARTED" });
    SoundFX.spinStart();

    const effSpeed = holdTurbo && state.speedMode === 0 ? 1 : state.speedMode;
    reelColEls.forEach(col => {
      col.classList.remove("landed");
      col.classList.add("spinning");
    });

    const res = await api("/api/games/buffalo/play", {
      method: "POST",
      body: JSON.stringify({ betAmount: bet, bonusBuy })
    });

    if (!res || !res.success || !res.outcome) {
      reelColEls.forEach(col => col.classList.remove("spinning"));
      btnSpin.classList.remove("spinning");
      state.spinning = false;
      state.autospinLeft = 0;
      autoActiveFlag = false;
      updateHUD();
      postParent({ type: "BET_ENDED" });
      winTicker.innerHTML = `<span class="err-pill">${res?.message || "Spin error, please retry"}</span>`;
      if (String(res?.message || "").toLowerCase().includes("insufficient")) {
        postParent({ type: "OPEN_DEPOSIT" });
      }
      refreshBalance();
      return;
    }

    // Hold payout visually until reels & features finish
    state.balance = Math.max(0, roundMoney(res.newBalance - res.payout));
    updateHUD();

    const { baseGrid, baseEval, baseBonus, freeSpins } = res.outcome;
    state.grid = baseGrid;

    await revealColumns(baseGrid, effSpeed);
    btnSpin.classList.remove("spinning");

    if (baseEval.totalWin > 0) {
      showWinHighlights(baseEval);
      const baseMult = baseEval.totalWin / bet;
      winTicker.innerHTML = `<span class="win-pill">WIN ${fmtMoney(baseEval.totalWin)}</span>`;
      if (baseMult >= 15) SoundFX.winBig();
      else SoundFX.winSmall();

      if (baseMult >= 20) {
        const tier = baseMult >= 50 ? "SUPER WIN!" : baseMult >= 30 ? "MEGA WIN!" : "BIG WIN!";
        await showSplash(tier, `${baseEval.lineWins.length} PAYLINE${baseEval.lineWins.length === 1 ? "" : "S"}`, fmtMoney(baseEval.totalWin), 2400);
      }
    }

    if (baseBonus) {
      SoundFX.featureTrigger();
      await showSplash(
        "BONUS GAME!",
        `${baseEval.bonusCount} BONUS COINS LANDED`,
        "3 RESPINS AWARDED",
        2200
      );
      await playServerBonusGame(baseBonus, effSpeed);
    }

    if (freeSpins) {
      const sc = Math.min(5, baseEval.scatterCount);
      SoundFX.featureTrigger();
      await showSplash(
        "FREE SPINS!",
        bonusBuy === "freespins" ? "BONUS BUY TRIGGERED" : `${sc} SCATTERS TRIGGERED`,
        `${freeSpins.initialSpins} FREE SPINS`,
        2300
      );
      await playServerFreeSpins(freeSpins, bet, effSpeed);
    }

    state.balance = res.newBalance;
    state.spinning = false;
    updateHUD();

    const label = bonusBuy === "freespins" ? "Bonus Buy (FS)"
                : bonusBuy === "bonus" ? "Bonus Buy (Coins)"
                : freeSpins ? "Main + Free Spins"
                : baseBonus ? "Main + Bonus Game"
                : "Main Spin";
    logHistory(label, cost, res.payout);

    if (res.payout > 0 && (baseBonus || freeSpins)) {
      winTicker.innerHTML = `<span class="win-pill">TOTAL WIN ${fmtMoney(res.payout)}${res.capped ? " (MAX CAP)" : ""}</span>`;
    }

    postParent({ type: "BALANCE_UPDATE", newBalance: res.newBalance });
    postParent({ type: "BET_ENDED" });

    if (state.mode === "main" && state.autospinLeft > 0 && autospinRunning()) {
      state.autospinLeft--;
      updateHUD();
      await sleep(effSpeed === 2 ? 220 : 520);
      if (autospinRunning()) runSpin();
    }
  }

      runSpin("freespins");
    };
    document.getElementById("buyBGBtn").onclick = () => {
      if (state.balance < bgCost) return;
      closeDialog();
      closeMenu();
      runSpin("bonus");
    };
  }

  function openAutospinDialog() {
    if (state.mode !== "main") return;
    SoundFX.click();
    if (state.autospinLeft > 0) {
      state.autospinLeft = 0;
      autoActiveFlag = false;
      updateHUD();
      return;
    }

    dialogBox.innerHTML = `
      <div class="dialog-head">
        <h3>Autospin</h3>
        <button class="dialog-close" id="dlgClose">&times;</button>
      </div>
      <p style="margin:0 0 10px;font-size:12.5px;color:#9eb0c7;">Select number of automatic spins at current bet (${fmtMoney(currentBet())}):</p>
      <div class="auto-grid">
        <button class="auto-count-btn" data-n="10">10 Spins</button>
        <button class="auto-count-btn" data-n="25">25 Spins</button>
        <button class="auto-count-btn" data-n="50">50 Spins</button>
        <button class="auto-count-btn" data-n="100">100 Spins</button>
      </div>
    `;
    dialogBackdrop.classList.add("active");
    document.getElementById("dlgClose").onclick = closeDialog;
    dialogBox.querySelectorAll(".auto-count-btn").forEach(btn => {
      btn.onclick = () => {
        const n = Number(btn.dataset.n);
        closeDialog();
        state.autospinLeft = n;
        autoActiveFlag = true;
        updateHUD();
        if (!state.spinning) {
          state.autospinLeft--;
          updateHUD();
          runSpin();
        }
      };
    });
  }

  function closeDialog() {
    dialogBackdrop.classList.remove("active");
  }

  dialogBackdrop.addEventListener("click", (e) => {
    if (e.target === dialogBackdrop) closeDialog();
  });

  /* =========================================================================
     13. EVENT BINDINGS, AUTH INIT & HOLD-FOR-TURBO
     ========================================================================= */
  function updateSoundIcon() {
    const svg = document.getElementById("soundIconSvg");
    if (state.soundOn) {
      svg.innerHTML = `<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>`;
    } else {
      svg.innerHTML = `<path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>`;
    }
  }

  let spinHoldTimer = null;
  let spinHeldFired = false;

  btnSpin.addEventListener("pointerdown", () => {
    if (state.autospinLeft > 0) return;
    spinHeldFired = false;
    spinHoldTimer = setTimeout(() => {
      spinHeldFired = true;
      if (!state.spinning && state.mode === "main") runSpin(null, true);
    }, 360);
  });

  btnSpin.addEventListener("pointerup", () => {
    clearTimeout(spinHoldTimer);
    if (state.autospinLeft > 0) {
      state.autospinLeft = 0;
      autoActiveFlag = false;
      updateHUD();
      return;
    }
    if (!spinHeldFired && !state.spinning && state.mode === "main") {
      runSpin(null, false);
    }
  });
  btnSpin.addEventListener("pointerleave", () => clearTimeout(spinHoldTimer));

  btnSpeed.addEventListener("click", () => {
    SoundFX.click();
    state.speedMode = (state.speedMode + 1) % 3;
    updateHUD();
  });

  btnAutospin.addEventListener("click", openAutospinDialog);
  btnBonusBuy.addEventListener("click", openBonusBuyDialog);

  btnBetDec.addEventListener("click", () => {
    if (state.betIndex > 0 && !state.spinning && state.mode === "main") {
      SoundFX.click();
      state.betIndex--;
      updateHUD();
    }
  });
  btnBetInc.addEventListener("click", () => {
    if (state.betIndex < BET_STEPS.length - 1 && !state.spinning && state.mode === "main") {
      SoundFX.click();
      state.betIndex++;
      updateHUD();
    }
  });

  document.getElementById("btnSound").addEventListener("click", () => {
    state.soundOn = !state.soundOn;
    updateSoundIcon();
    if (state.soundOn) SoundFX.click();
  });

  document.getElementById("btnBack").addEventListener("click", () => {
    postParent({ type: "EXIT_GAME" });
  });

  document.getElementById("btnMenu").addEventListener("click", () => openMenu("paytable"));
  document.getElementById("btnMenuClose").addEventListener("click", closeMenu);

  document.querySelectorAll(".menu-nav-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const tab = btn.dataset.tab;
      if (tab === "home") {
        closeMenu();
      } else if (tab === "bonusbuy") {
        closeMenu();
        openBonusBuyDialog();
      } else {
        SoundFX.click();
        state.activeMenuTab = tab;
        renderMenuTab();
      }
    });
  });

  window.addEventListener("keydown", (e) => {
    if (e.code === "Space" && !menuOverlay.classList.contains("active") && !dialogBackdrop.classList.contains("active")) {
      e.preventDefault();
      if (splashResolve) splashResolve();
      else if (!state.spinning && state.mode === "main") runSpin();
    }
  });

  function updateClock() {
    const d = new Date();
    const str = d.toTimeString().slice(0, 5);
    document.getElementById("liveClock").textContent = str;
    document.getElementById("menuClock").textContent = str;
  }

  async function refreshBalance() {
    if (!INIT_DATA) return;
    const d = await api("/api/user/init");
    if (d && d.success && Number.isFinite(Number(d.balance))) {
      state.balance = roundMoney(d.balance);
      if (!state.spinning) updateHUD();
      postParent({ type: "BALANCE_UPDATE", newBalance: state.balance });
    }
  }

  async function loadServerConfig() {
    const cfg = await api("/api/games/buffalo/config");
    if (cfg && cfg.success) {
      if (Number.isFinite(Number(cfg.rtp))) state.rtpPct = Number(cfg.rtp);
      if (Number.isFinite(Number(cfg.maxPayout))) state.maxPayout = Number(cfg.maxPayout);
      if (Array.isArray(cfg.betSteps) && cfg.betSteps.length) {
        BET_STEPS = cfg.betSteps;
        if (state.betIndex >= BET_STEPS.length) state.betIndex = Math.min(2, BET_STEPS.length - 1);
      }
      updateHUD();
    }
  }

  window.addEventListener("message", (e) => {
    if (e.source !== window.parent) return;
    const d = e.data || {};
    if (d.type === "INIT" && d.initData) {
      INIT_DATA = d.initData;
      if (Number.isFinite(Number(d.balance))) {
        state.balance = roundMoney(d.balance);
        updateHUD();
      }
      refreshBalance();
    } else if (d.type === "UPDATE_BALANCE") {
      if (Number.isFinite(Number(d.balance))) {
        state.balance = roundMoney(d.balance);
        if (!state.spinning) updateHUD();
      } else {
        refreshBalance();
      }
    } else if (d.type === "GAME_PAUSED") {
      state.autospinLeft = 0;
      autoActiveFlag = false;
    }
  });

  /* =========================================================================
     14. INITIALIZE BOARD & CONNECT TO SERVER
     ========================================================================= */
  buildBoardDOM();
  state.grid = buildPreviewGrid();
  renderGrid(state.grid);
  updateHUD();
  updateSoundIcon();
  updateClock();
  setInterval(updateClock, 15000);

  postParent({ type: "GAME_READY" });
  loadServerConfig();

  // Standalone browser launch fallback (server rejects demo_session in production)
  setTimeout(() => {
    if (!INIT_DATA && window.self === window.top) {
      INIT_DATA = "demo_session";
      refreshBalance();
    }
  }, 300);
})();
</script>
</body>
</html>
