<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Young Buffalo Song — Video Slot</title>
<style>
  :root {
    --bg-dark: #100c14;
    --panel-bg: #171c26;
    --panel-card: #1e2431;
    --border-gold: #d99b38;
    --gold-bright: #ffd35c;
    --accent-blue: #3f9bff;
    --text-main: #f4f7fb;
    --text-muted: #8c9bb3;
    --parchment-light: #fbf1d6;
    --parchment-dark: #ecd7ad;
    --reel-divider: #c79f61;
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #09070b;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--text-main);
    overflow: hidden;
  }

  /* Desktop wrapper centers a sleek mobile-first cabinet */
  .viewport-wrap {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 35%, #2a1820 0%, #09070b 75%);
  }

  .game-shell {
    position: relative;
    width: 100%;
    max-width: 450px;
    height: 100%;
    max-height: 920px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 25px 70px rgba(0,0,0,0.85);
    background: linear-gradient(180deg,
      #467387 0%,
      #789ba1 16%,
      #d6b88e 31%,
      #a84b2e 45%,
      #6b1012 68%,
      #3b060a 88%,
      #090709 100%
    );
  }

  @media (min-width: 500px) and (min-height: 760px) {
    .game-shell {
      height: 94vh;
      border-radius: 26px;
      border: 2px solid rgba(255, 200, 100, 0.25);
    }
  }

  /* Scenic clouds & prairie floor SVG layer */
  .scenic-bg {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }

  /* Top status bar */
  .top-header {
    position: relative;
    z-index: 5;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 14px 4px;
    font-size: 12px;
    font-weight: 600;
    color: rgba(255,255,255,0.88);
    text-shadow: 0 1px 3px rgba(0,0,0,0.6);
  }

  /* Mode banner (Free Spins / Bonus Game) */
  .mode-banner {
    position: relative;
    z-index: 6;
    margin: 2px auto 0;
    padding: 4px 14px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.7px;
    text-transform: uppercase;
    background: linear-gradient(90deg, #4b1d78, #8e24aa, #4b1d78);
    border: 1px solid #f6c75e;
    color: #fff;
    box-shadow: 0 4px 14px rgba(0,0,0,0.5);
    display: none;
    align-items: center;
    gap: 10px;
  }
  .mode-banner.bonus-mode {
    background: linear-gradient(90deg, #8b4200, #d47b00, #8b4200);
  }
  .mode-banner.active {
    display: inline-flex;
  }

  /* Main stage area */
  .stage-area {
    position: relative;
    z-index: 4;
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 4px 6px 0;
    min-height: 0;
  }

  /* Jackpot Header Row */
  .jackpot-bar {
    position: relative;
    display: grid;
    grid-template-columns: 1fr 1fr 1.25fr 1fr 1fr;
    align-items: end;
    gap: 3px;
    padding: 0 4px;
    margin-bottom: -2px;
    z-index: 7;
  }

  .jp-box {
    border-radius: 6px 6px 2px 2px;
    border: 1.5px solid #e5a942;
    text-align: center;
    padding: 2px 2px 3px;
    background: #10203a;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.25), 0 3px 6px rgba(0,0,0,0.6);
  }
  .jp-box.mini { background: linear-gradient(180deg, #1b65a6, #0d3257); }
  .jp-box.mega { background: linear-gradient(180deg, #1b7844, #0b3c21); }
  .jp-box.super { background: linear-gradient(180deg, #6b268e, #330d49); }
  .jp-box.grand { background: linear-gradient(180deg, #a6251b, #4f0a06); }

  .jp-label {
    font-size: 9px;
    font-weight: 900;
    letter-spacing: 0.6px;
    color: #ffd86f;
    text-shadow: 0 1px 2px #000;
    line-height: 1.1;
  }
  .jp-val {
    font-size: 11px;
    font-weight: 800;
    color: #fff;
    text-shadow: 0 1px 2px #000;
    line-height: 1.15;
    font-variant-numeric: tabular-nums;
  }

  .logo-crest {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 4px 2px 2px;
    margin-bottom: -4px;
    background: radial-gradient(ellipse at center, #78260e 0%, #3d0f04 80%);
    border: 2px solid #f0b84b;
    border-radius: 12px 12px 4px 4px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.75);
  }
  .logo-feathers {
    position: absolute;
    top: -11px;
    display: flex;
    gap: 2px;
  }
  .logo-feathers span {
    width: 5px;
    height: 11px;
    border-radius: 50% 50% 0 0;
    background: linear-gradient(180deg, #ff5f38, #f2b749);
    border: 1px solid #4a1506;
    transform-origin: bottom center;
  }
  .logo-feathers span:nth-child(1) { transform: rotate(-28deg); }
  .logo-feathers span:nth-child(2) { transform: rotate(-14deg); height: 13px; }
  .logo-feathers span:nth-child(3) { height: 14px; }
  .logo-feathers span:nth-child(4) { transform: rotate(14deg); height: 13px; }
  .logo-feathers span:nth-child(5) { transform: rotate(28deg); }

  .logo-small {
    font-size: 7.5px;
    font-weight: 900;
    letter-spacing: 1px;
    color: #ffe8a3;
    line-height: 1;
  }
  .logo-big {
    font-size: 11.5px;
    font-weight: 900;
    letter-spacing: 0.4px;
    background: linear-gradient(180deg, #fff5bf 0%, #ffc43d 55%, #d66c00 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 1px 1px #000);
    line-height: 1.05;
  }
  .logo-sub {
    font-size: 9px;
    font-weight: 900;
    color: #ffcf5c;
    letter-spacing: 1.5px;
    line-height: 1;
  }

  /* Reel Cabinet Frame */
  .reel-frame {
    position: relative;
    background: linear-gradient(180deg, #b85b1c, #7c3209);
    padding: 6px;
    border-radius: 8px;
    border: 2.5px solid #f0b74c;
    box-shadow: 0 12px 28px rgba(0,0,0,0.7), inset 0 0 8px rgba(0,0,0,0.6);
  }

  .reel-board {
    position: relative;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 2px;
    background: #875c2b;
    border-radius: 4px;
    overflow: hidden;
    aspect-ratio: 5 / 4;
    width: 100%;
  }

  .reel-col {
    position: relative;
    display: grid;
    grid-template-rows: repeat(4, 1fr);
    background: linear-gradient(180deg, var(--parchment-dark) 0%, var(--parchment-light) 22%, var(--parchment-light) 78%, var(--parchment-dark) 100%);
    overflow: hidden;
  }

  .reel-col.spinning .cell-inner {
    animation: reelBlurSpin 0.14s linear infinite;
  }

  @keyframes reelBlurSpin {
    0% { transform: translateY(-28%); filter: blur(1.4px); opacity: 0.85; }
    50% { transform: translateY(28%); filter: blur(1.8px); opacity: 0.9; }
    100% { transform: translateY(-28%); filter: blur(1.4px); opacity: 0.85; }
  }

  @keyframes reelBounce {
    0% { transform: translateY(-14%); }
    60% { transform: translateY(5%); }
    100% { transform: translateY(0); }
  }
  .reel-col.landed .cell-inner {
    animation: reelBounce 0.22s ease-out;
  }

  .symbol-cell {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 3px;
    overflow: hidden;
  }

  .cell-inner {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .symbol-cell.win-highlight {
    z-index: 3;
  }
  .symbol-cell.win-highlight::after {
    content: "";
    position: absolute;
    inset: 2px;
    border-radius: 8px;
    border: 2.5px solid #ffe14f;
    box-shadow: 0 0 12px #ffae00, inset 0 0 10px rgba(255, 215, 0, 0.45);
    animation: pulseWin 0.7s ease-in-out infinite alternate;
    pointer-events: none;
  }
  .symbol-cell.dimmed {
    opacity: 0.42;
    transition: opacity 0.2s;
  }
  @keyframes pulseWin {
    from { transform: scale(0.97); opacity: 0.85; }
    to { transform: scale(1.02); opacity: 1; }
  }

  /* Bonus Hold & Win locked cell overlay */
  .symbol-cell.bonus-locked {
    background: radial-gradient(circle, rgba(255,196,46,0.22), transparent 75%);
  }
  .symbol-cell.respin-spinning .cell-inner {
    animation: reelBlurSpin 0.13s linear infinite;
  }

  .bonus-empty-slot {
    width: 82%;
    height: 82%;
    border-radius: 50%;
    border: 2px dashed rgba(155, 110, 48, 0.35);
    background: rgba(120, 82, 30, 0.08);
  }

  /* SVG Payline overlay */
  .payline-svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 6;
  }

  /* Wild Multiplier Badge */
  .wild-mult-badge {
    position: absolute;
    top: 3px;
    right: 3px;
    background: linear-gradient(180deg, #ff5924, #b00000);
    border: 1.5px solid #ffe46b;
    color: #fff;
    font-size: 11px;
    font-weight: 900;
    padding: 1px 5px;
    border-radius: 999px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.65);
    z-index: 4;
    line-height: 1.1;
  }

  /* Bonus Coin Text */
  .bonus-coin-wrap {
    position: relative;
    width: 92%;
    height: 92%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .bonus-coin-label {
    position: absolute;
    font-weight: 900;
    color: #fffdf0;
    text-shadow: 0 1.5px 2px #5c1900, 0 0 4px #3b0d00;
    letter-spacing: -0.3px;
    text-align: center;
    pointer-events: none;
  }

  /* Win Ticker Banner */
  .win-ticker {
    min-height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 6px;
    font-size: 13px;
    font-weight: 800;
    color: #ffe382;
    text-shadow: 0 2px 5px rgba(0,0,0,0.85);
    text-align: center;
  }
  .win-ticker .win-pill {
    background: rgba(20, 8, 8, 0.72);
    border: 1px solid rgba(255, 208, 92, 0.55);
    padding: 3px 14px;
    border-radius: 999px;
    animation: popIn 0.25s ease-out;
  }
  @keyframes popIn {
    from { transform: scale(0.85); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  /* Bonus Buy Button row */
  .bonus-buy-row {
    position: relative;
    z-index: 5;
    display: flex;
    justify-content: flex-end;
    padding: 4px 16px 6px;
  }
  .btn-bonus-buy {
    background: #ffffff;
    color: #11151d;
    border: none;
    border-radius: 999px;
    padding: 9px 18px;
    font-size: 11.5px;
    font-weight: 900;
    letter-spacing: 0.4px;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(0,0,0,0.45);
    transition: transform 0.12s, opacity 0.15s;
  }
  .btn-bonus-buy:active { transform: scale(0.95); }
  .btn-bonus-buy:disabled { opacity: 0.45; cursor: not-allowed; }

  /* Spin Controls Row */
  .controls-row {
    position: relative;
    z-index: 5;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 24px;
    padding: 4px 16px 10px;
  }

  .btn-icon {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: none;
    background: rgba(255,255,255,0.08);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    position: relative;
    transition: background 0.15s, transform 0.12s;
  }
  .btn-icon:hover { background: rgba(255,255,255,0.16); }
  .btn-icon:active { transform: scale(0.92); }
  .btn-icon.active-speed {
    color: #ffd35c;
    background: rgba(255, 211, 92, 0.18);
    box-shadow: 0 0 10px rgba(255, 211, 92, 0.3);
  }
  .speed-tag {
    position: absolute;
    bottom: -4px;
    font-size: 8px;
    font-weight: 900;
    background: #ffd35c;
    color: #111;
    padding: 0 4px;
    border-radius: 4px;
    display: none;
  }
  .btn-icon.active-speed .speed-tag { display: block; }

  .btn-spin {
    width: 78px;
    height: 78px;
    border-radius: 50%;
    border: none;
    background: #ffffff;
    color: #16181f;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 6px 24px rgba(0,0,0,0.55);
    transition: transform 0.12s, background 0.15s;
    position: relative;
  }
  .btn-spin:active { transform: scale(0.94); }
  .btn-spin.spinning svg { animation: spinRotate 0.7s linear infinite; }
  .btn-spin.free-spin-btn {
    background: linear-gradient(135deg, #b858ff, #6c11cb);
    color: #fff;
    border: 2px solid #ffd35c;
  }
  .btn-spin.bonus-spin-btn {
    background: linear-gradient(135deg, #ffb42b, #c95800);
    color: #fff;
    border: 2px solid #fff0b3;
  }
  @keyframes spinRotate {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  .spin-counter {
    font-size: 20px;
    font-weight: 900;
    line-height: 1;
  }
  .spin-subtext {
    font-size: 8px;
    font-weight: 800;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  /* Bottom Bar */
  .bottom-bar {
    position: relative;
    z-index: 5;
    display: grid;
    grid-template-columns: auto auto 1fr auto;
    align-items: center;
    gap: 8px;
    padding: 8px 12px 14px;
    background: linear-gradient(180deg, rgba(0,0,0,0.15), rgba(0,0,0,0.92));
  }

  .btn-bare {
    width: 36px;
    height: 36px;
    border: none;
    background: transparent;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    border-radius: 8px;
  }
  .btn-bare:active { background: rgba(255,255,255,0.1); }

  .bet-pill {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 999px;
    padding: 4px 6px;
    max-width: 185px;
    margin: 0 auto;
    width: 100%;
  }
  .bet-step {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: none;
    background: rgba(255,255,255,0.08);
    color: #fff;
    font-size: 18px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .bet-step:active { background: rgba(255,255,255,0.2); }
  .bet-step:disabled { opacity: 0.35; cursor: not-allowed; }
  .bet-info {
    text-align: center;
    padding: 0 6px;
  }
  .bet-label {
    font-size: 9px;
    color: var(--text-muted);
    font-weight: 700;
    letter-spacing: 0.6px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 3px;
  }
  .bet-val {
    font-size: 12px;
    font-weight: 800;
    color: #fff;
    font-variant-numeric: tabular-nums;
  }

  .balance-box {
    text-align: right;
  }
  .bal-label {
    font-size: 9px;
    color: var(--text-muted);
    font-weight: 700;
    letter-spacing: 0.6px;
  }
  .bal-val {
    font-size: 12px;
    font-weight: 800;
    color: #fff;
    font-variant-numeric: tabular-nums;
  }

  /* Big Win / Feature Splash Overlay */
  .splash-overlay {
    position: absolute;
    inset: 0;
    z-index: 40;
    background: rgba(8, 5, 12, 0.84);
    backdrop-filter: blur(4px);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    cursor: pointer;
  }
  .splash-overlay.active {
    display: flex;
    animation: fadeIn 0.25s ease-out;
  }
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  .splash-title {
    font-size: 30px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    background: linear-gradient(180deg, #fff6c9 0%, #ffc83b 50%, #e06d00 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 4px 12px rgba(255, 166, 0, 0.55));
    margin-bottom: 8px;
  }
  .splash-subtitle {
    font-size: 14px;
    font-weight: 700;
    color: #e6ecf5;
    margin-bottom: 14px;
  }
  .splash-amount {
    font-size: 38px;
    font-weight: 900;
    color: #fff;
    text-shadow: 0 0 24px rgba(255, 200, 60, 0.85);
    font-variant-numeric: tabular-nums;
  }
  .splash-hint {
    margin-top: 22px;
    font-size: 11px;
    color: #b7c2d4;
    letter-spacing: 0.8px;
    text-transform: uppercase;
  }

  /* Full-Screen Menu Overlay (Paytable, Rules, History, Settings) */
  .menu-overlay {
    position: absolute;
    inset: 0;
    z-index: 50;
    background: #10141c;
    display: none;
    flex-direction: column;
  }
  .menu-overlay.active {
    display: flex;
    animation: slideUp 0.22s ease-out;
  }
  @keyframes slideUp {
    from { transform: translateY(20px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }

  .menu-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px 10px;
    background: #171d28;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .menu-header-spacer { width: 42px; font-size: 12px; color: var(--text-muted); }
  .menu-title-wrap { text-align: center; }
  .menu-title { font-size: 17px; font-weight: 700; color: #fff; }
  .menu-sub { font-size: 11px; color: #b7c4d6; margin-top: 2px; }
  .menu-close {
    width: 34px;
    height: 34px;
    border: none;
    background: transparent;
    color: var(--accent-blue);
    font-size: 26px;
    font-weight: 700;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: flex-end;
  }

  .menu-body {
    flex: 1;
    overflow-y: auto;
    padding: 14px 14px 24px;
  }
  .menu-body::-webkit-scrollbar { width: 4px; }
  .menu-body::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.18); border-radius: 4px; }

  .menu-section-title {
    font-size: 16px;
    font-weight: 800;
    letter-spacing: 0.4px;
    color: #fff;
    margin: 14px 0 10px;
    text-transform: uppercase;
  }
  .menu-section-title:first-child { margin-top: 2px; }

  .menu-card {
    background: #19202c;
    border-radius: 10px;
    padding: 16px;
    border: 1px solid rgba(255,255,255,0.06);
    margin-bottom: 14px;
  }
  .menu-card p {
    margin: 0 0 8px;
    font-size: 13.5px;
    line-height: 1.48;
    color: #8f9eb3;
  }
  .menu-card p:last-child { margin-bottom: 0; }

  .payout-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px 12px;
  }
  .payout-item {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .payout-icon {
    width: 58px;
    height: 58px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #faf0d4;
    border-radius: 8px;
    padding: 3px;
  }
  .payout-rows {
    display: flex;
    flex-direction: column;
    gap: 2px;
    font-size: 12.5px;
    font-weight: 600;
    border-left: 1px solid rgba(255,255,255,0.15);
    padding-left: 8px;
  }
  .payout-row {
    display: flex;
    gap: 8px;
  }
  .payout-row span:first-child { color: #95a4ba; width: 12px; }
  .payout-row span:last-child { color: var(--accent-blue); font-weight: 700; }

  .feature-icon-center {
    width: 84px;
    height: 84px;
    margin: 0 auto 14px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .scatter-pay-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    margin-bottom: 14px;
  }

  /* Paylines grid in Paytable */

  /* =========================================================================
     3. SYNTHESIZED WEB AUDIO API SOUND EFFECTS
     ========================================================================= */
  const SoundFX = (() => {
    let ctx = null;
    function getCtx() {
      if (!state.soundOn) return null;
      if (!ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) ctx = new AC();
      }
      if (ctx && ctx.state === "suspended") ctx.resume();
      return ctx;
    }

    function tone(freq, dur, type = "sine", vol = 0.08, delay = 0) {
      const c = getCtx();
      if (!c) return;
      const now = c.currentTime + delay;
      const osc = c.createOscillator();
      const gain = c.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, now);
      gain.gain.setValueAtTime(vol, now);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);
      osc.connect(gain);
      gain.connect(c.destination);
      osc.start(now);
      osc.stop(now + dur);
    }

    return {
      click: () => tone(540, 0.05, "triangle", 0.05),
      spinStart: () => {
        tone(240, 0.08, "triangle", 0.07, 0);
        tone(360, 0.1, "triangle", 0.06, 0.05);
      },
      reelStop: (idx) => tone(150 + idx * 28, 0.07, "sine", 0.08),
      winSmall: () => {
        [523.25, 659.25, 783.99].forEach((f, i) => tone(f, 0.16, "triangle", 0.08, i * 0.07));
      },
      winBig: () => {
        [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach((f, i) => tone(f, 0.25, "sawtooth", 0.06, i * 0.08));
      },
      featureTrigger: () => {
        [392, 523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, 0.3, "triangle", 0.1, i * 0.09));
      },
      coinLand: () => tone(980, 0.12, "sine", 0.09)
    };
  })();

  /* =========================================================================
     5. WEIGHTED RNG & REEL OUTCOME GENERATOR
     ========================================================================= */
  const REGULAR_WEIGHTS = [
    ["buffalo", 7],
    ["eagle",   9],
    ["wolf",    11],
    ["cougar",  13],
    ["horse",   15],
    ["A",       17],
    ["K",       17],
    ["Q",       20],
    ["J",       20],
    ["10",      20]
  ];

  function pickWeighted(table) {
    let total = 0;
    for (const [, w] of table) total += w;
    let r = Math.random() * total;
    for (const [item, w] of table) {
      r -= w;
      if (r <= 0) return item;
    }
    return table[0][0];
  }

  function makeCoinData(bet) {
    const roll = Math.random();
    if (roll < 0.008) return { coinVal: bet * JACKPOTS.SUPER, coinLabel: "SUPER" };
    if (roll < 0.025) return { coinVal: bet * JACKPOTS.MEGA, coinLabel: "MEGA" };
    if (roll < 0.075) return { coinVal: bet * JACKPOTS.MINI, coinLabel: "MINI" };
    const mults = [1, 1, 1, 2, 2, 3, 3, 4, 5, 10, 15];
    const m = mults[Math.floor(Math.random() * mults.length)];
    const val = bet * m;
    return { coinVal: val, coinLabel: formatCompactCoin(val) };
  }

  function formatCompactCoin(v) {
    if (v >= 100000) return Math.round(v / 1000) + "K";
    return Number.isInteger(v) ? String(v) : v.toFixed(0);
  }

  function generateSpinGrid(mode, bet, forcedTrigger = null) {
    const grid = Array.from({ length: COLS }, () => Array(ROWS).fill(null));
    const inFS = mode === "freespins";

    // Optional forced trigger for Bonus Buy
    let forcedScatterCols = [];
    let forcedBonusCells = [];
    if (forcedTrigger === "freespins") {
      const count = Math.random() < 0.15 ? 4 : 3;
      const cols = [0, 1, 2, 3, 4].sort(() => Math.random() - 0.5).slice(0, count);
      forcedScatterCols = cols;
    } else if (forcedTrigger === "bonus") {
      const count = 8 + (Math.random() < 0.25 ? 1 : 0);
      const allPos = [];
      for (let c = 0; c < COLS; c++) for (let r = 0; r < ROWS; r++) allPos.push([c, r]);
      allPos.sort(() => Math.random() - 0.5);
      forcedBonusCells = allPos.slice(0, count);
    }

    for (let c = 0; c < COLS; c++) {
      let hasScatterInCol = false;
      for (let r = 0; r < ROWS; r++) {
        // Check forced positions
        if (forcedBonusCells.some(([fc, fr]) => fc === c && fr === r)) {
          const coin = makeCoinData(bet);
          grid[c][r] = { id: "bonus", mult: 0, ...coin };
          continue;
        }
        if (forcedScatterCols.includes(c) && !hasScatterInCol && r === Math.floor(Math.random() * ROWS)) {
          grid[c][r] = { id: "scatter", mult: 0 };
          hasScatterInCol = true;
          continue;
        }

        const roll = Math.random();
        // Wilds appear ONLY on reels 2-4 (col indices 1, 2, 3)
        if ((c >= 1 && c <= 3) && roll < (inFS ? 0.14 : 0.085)) {
          let mult = 0;
          if (inFS) {
            // In Free Spins, ALL Wild symbols have x2 or x3
            mult = Math.random() < 0.65 ? 2 : 3;
          } else {
            // In Main Game, Wilds can contain x2 and x3
            const mr = Math.random();
            if (mr < 0.35) mult = 2;
            else if (mr < 0.50) mult = 3;
          }
          grid[c][r] = { id: "wild", mult };
        } else if (!hasScatterInCol && roll < (inFS ? 0.175 : 0.125)) {
          grid[c][r] = { id: "scatter", mult: 0 };
          hasScatterInCol = true;
        } else if (roll < 0.225) {
          const coin = makeCoinData(bet);
          grid[c][r] = { id: "bonus", mult: 0, ...coin };
        } else {
          grid[c][r] = { id: pickWeighted(REGULAR_WEIGHTS), mult: 0 };
        }
      }
      // Guarantee scatter if forced on this col and random row didn't trigger
      if (forcedScatterCols.includes(c) && !hasScatterInCol) {
        const rr = Math.floor(Math.random() * ROWS);
        grid[c][rr] = { id: "scatter", mult: 0 };
      }
    }
    return grid;
  }

  /* =========================================================================
     6. WIN EVALUATION ENGINE (20 PAYLINES, WILD SUMS, SCATTERS, BONUS)
     ========================================================================= */
  function evaluateSpin(grid, bet) {
    const lineWins = [];
    let totalWin = 0;

    for (let li = 0; li < PAYLINES.length; li++) {
      const line = PAYLINES[li];
      const firstCell = grid[0][line[0]];
      if (firstCell.id === "scatter" || firstCell.id === "bonus" || firstCell.id === "wild") {
        continue;
      }
      const target = firstCell.id;
      let count = 1;
      let multSum = 0;
      const cells = [[0, line[0]]];

      for (let c = 1; c < COLS; c++) {
        const cell = grid[c][line[c]];
        if (cell.id === target || cell.id === "wild") {
          count++;
          cells.push([c, line[c]]);
          if (cell.id === "wild" && (cell.mult === 2 || cell.mult === 3)) {
            multSum += cell.mult;
          }
        } else {
          break;
        }
      }

      const payMap = PAYTABLE[target];
      if (payMap && payMap[count]) {
        const effectiveMult = multSum > 0 ? multSum : 1;
        const winAmt = roundMoney(bet * payMap[count] * effectiveMult);
        totalWin = roundMoney(totalWin + winAmt);
        lineWins.push({
          lineIndex: li,
          lineNumber: li + 1,
          symbol: target,
          count,
          mult: effectiveMult,
          amount: winAmt,
          cells
        });
      }
    }

    // Evaluate Scatters anywhere
    const scatterCells = [];
    const bonusCells = [];
    for (let c = 0; c < COLS; c++) {
      for (let r = 0; r < ROWS; r++) {
        if (grid[c][r].id === "scatter") scatterCells.push([c, r]);
        if (grid[c][r].id === "bonus") bonusCells.push([c, r]);
      }
    }

    let scatterWin = 0;
    const scCount = Math.min(5, scatterCells.length);
    if (SCATTER_PAY[scCount]) {
      scatterWin = roundMoney(bet * SCATTER_PAY[scCount]);
      totalWin = roundMoney(totalWin + scatterWin);
    }

    return {
      totalWin,
      lineWins,
      scatterCells,
      scatterWin,
      scatterCount: scatterCells.length,
      bonusCells,
      bonusCount: bonusCells.length
    };
  }

  function roundMoney(n) { return Math.round(n * 100) / 100; }

  function fmtMoney(n) {
    return "DEMO " + n.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

          ${getSymbolSVG("bonus")}
          <div class="bonus-coin-label" style="font-size:${fs}">${lbl}</div>
        </div>`;
    } else if (cellData.id === "wild" && cellData.mult >= 2) {
      inner.innerHTML = `${getSymbolSVG("wild")}<div class="wild-mult-badge">x${cellData.mult}</div>`;
    } else {
      inner.innerHTML = getSymbolSVG(cellData.id);

  /* =========================================================================
     8. PAYLINE & WIN VISUALIZATION
     ========================================================================= */
  let paylineCycleTimer = null;

  function clearWinHighlights() {
    if (paylineCycleTimer) {
      clearInterval(paylineCycleTimer);
      paylineCycleTimer = null;
    }
    paylineSvg.innerHTML = "";
    for (let c = 0; c < COLS; c++) {
      for (let r = 0; r < ROWS; r++) {
        cellEls[c][r].classList.remove("win-highlight", "dimmed");
      }
    }
  }

  function drawPayline(lineIndex, color) {
    const line = PAYLINES[lineIndex];
    const pts = line.map((r, c) => `${c * 100 + 50},${r * 100 + 50}`).join(" ");
    paylineSvg.innerHTML = `
      <polyline points="${pts}" fill="none" stroke="rgba(0,0,0,0.65)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
      <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
    `;
  }

  function showWinHighlights(evalRes) {
    clearWinHighlights();
    const hasLine = evalRes.lineWins.length > 0;
    const hasScat = evalRes.scatterWin > 0;
    if (!hasLine && !hasScat) return;

    // Dim all first, then highlight winners
    const highlightSet = new Set();
    evalRes.lineWins.forEach(w => w.cells.forEach(([c, r]) => highlightSet.add(`${c},${r}`)));
    if (hasScat) evalRes.scatterCells.forEach(([c, r]) => highlightSet.add(`${c},${r}`));

    for (let c = 0; c < COLS; c++) {
      for (let r = 0; r < ROWS; r++) {
        if (highlightSet.has(`${c},${r}`)) cellEls[c][r].classList.add("win-highlight");
        else cellEls[c][r].classList.add("dimmed");
      }
    }

    // Cycle individual lines smoothly
    if (hasLine) {
      let idx = 0;
      const showNext = () => {
        const lw = evalRes.lineWins[idx % evalRes.lineWins.length];
        drawPayline(lw.lineIndex, LINE_COLORS[lw.lineIndex % LINE_COLORS.length]);
        idx++;
      };
      showNext();
      if (evalRes.lineWins.length > 1) {
        paylineCycleTimer = setInterval(showNext, 1100);
      }
    }
  }

  /* =========================================================================
     9. SPLASH OVERLAY & ASYNC TIMING HELPERS
     ========================================================================= */
  let splashResolve = null;

  function showSplash(title, subtitle, amountText, autoCloseMs = 0) {
    return new Promise((resolve) => {
      document.getElementById("splashTitle").textContent = title;
      document.getElementById("splashSubtitle").textContent = subtitle;
      document.getElementById("splashAmount").textContent = amountText;
      splashOverlay.classList.add("active");

      let timer = null;
      const close = () => {
        if (timer) clearTimeout(timer);
        splashOverlay.classList.remove("active");
        splashResolve = null;
        resolve();
      };
      splashResolve = close;
      if (autoCloseMs > 0) timer = setTimeout(close, autoCloseMs);
    });
  }

  splashOverlay.addEventListener("click", () => {
    if (splashResolve) splashResolve();
  });

  const sleep = (ms) => new Promise(res => setTimeout(res, ms));

  /* =========================================================================
     10. MAIN SPIN, FREE SPINS & HOLD-AND-WIN BONUS ENGINE
     ========================================================================= */
  async function runSpin(forcedTrigger = null, holdTurbo = false) {
    if (state.spinning) return;

    const bet = currentBet();
    const isFree = state.mode === "freespins";

    if (!isFree && !forcedTrigger) {
      if (state.balance < bet) {
        state.autospinLeft = 0;
        updateHUD();
        winTicker.innerHTML = `<span class="win-pill">Insufficient balance! Reset Demo in Settings.</span>`;
        return;
      }
      state.balance = roundMoney(state.balance - bet);
    }

    state.spinning = true;
    clearWinHighlights();
    winTicker.innerHTML = "";
    updateHUD();
    btnSpin.classList.add("spinning");
    SoundFX.spinStart();

    // Generate outcome grid
    const newGrid = generateSpinGrid(state.mode, bet, forcedTrigger);
    state.grid = newGrid;

    // Spin speed timing
    const effSpeed = holdTurbo && state.speedMode === 0 ? 1 : state.speedMode;
    const baseDelay = effSpeed === 2 ? 110 : effSpeed === 1 ? 210 : 480;
    const colStagger = effSpeed === 2 ? 28 : effSpeed === 1 ? 55 : 130;

    reelColEls.forEach(col => {
      col.classList.remove("landed");
      col.classList.add("spinning");
    });

    await sleep(baseDelay);

    for (let c = 0; c < COLS; c++) {
      reelColEls[c].classList.remove("spinning");
      for (let r = 0; r < ROWS; r++) renderCell(c, r, newGrid[c][r]);
      reelColEls[c].classList.add("landed");
      SoundFX.reelStop(c);
      if (c < COLS - 1) await sleep(colStagger);
    }

    btnSpin.classList.remove("spinning");

    // Evaluate wins
    const evalRes = evaluateSpin(newGrid, bet);
    let spinPayout = evalRes.totalWin;

    if (spinPayout > 0) {
      state.balance = roundMoney(state.balance + spinPayout);
      if (isFree) state.freeSpinsTotalWin = roundMoney(state.freeSpinsTotalWin + spinPayout);
      showWinHighlights(evalRes);

      const mult = spinPayout / bet;
      winTicker.innerHTML = `<span class="win-pill">WIN ${fmtMoney(spinPayout)}</span>`;
      if (mult >= 15) SoundFX.winBig();
      else SoundFX.winSmall();

      if (mult >= 20) {
        const tier = mult >= 50 ? "SUPER WIN!" : mult >= 30 ? "MEGA WIN!" : "BIG WIN!";
        await showSplash(tier, `${evalRes.lineWins.length} PAYLINE${evalRes.lineWins.length === 1 ? "" : "S"}`, fmtMoney(spinPayout), 2600);
      }
    }

    // Record history (regular & FS spins)
    if (!forcedTrigger) {
      logHistory(isFree ? "Free Spin" : "Main Spin", isFree ? 0 : bet, spinPayout);
    }

    // Check Bonus Game trigger (8+ Bonus symbols anywhere)
    if (evalRes.bonusCount >= 8) {
      SoundFX.featureTrigger();
      await showSplash(
        "BONUS GAME!",
        `${evalRes.bonusCount} BONUS COINS LANDED`,
        "3 RESPINS AWARDED",
        2400
      );
      const bonusWin = await runBonusGame(newGrid, bet);
      spinPayout = roundMoney(spinPayout + bonusWin);
      if (isFree) state.freeSpinsTotalWin = roundMoney(state.freeSpinsTotalWin + bonusWin);
    }

    // Check Free Spins trigger or retrigger
    const sc = Math.min(5, evalRes.scatterCount);
    if (!isFree && sc >= 3) {
      const awarded = FREE_SPINS_INIT[sc];
      SoundFX.featureTrigger();
      await showSplash(
        "FREE SPINS!",
        `${sc} SCATTERS TRIGGERED`,
        `${awarded} FREE SPINS`,
        2500
      );
      await runFreeSpinsSession(awarded);
    } else if (isFree && sc >= 2) {
      const extra = FREE_SPINS_RETRIGGER[sc];
      state.freeSpinsLeft += extra;
      SoundFX.featureTrigger();
      winTicker.innerHTML = `<span class="win-pill">+${extra} EXTRA FREE SPINS!</span>`;
      await sleep(1100);
    }

    state.spinning = false;
    updateHUD();

    // Continue Autospin if active in main mode
    if (state.mode === "main" && state.autospinLeft > 0) {
      state.autospinLeft--;
      updateHUD();
      if (state.autospinLeft >= 0) {
        await sleep(effSpeed === 2 ? 220 : 520);
        if (state.autospinLeft > 0 || state.mode === "main") {
          // Only spin if autospinLeft wasn't cancelled
          if (autospinRunning()) runSpin();
        }
      }
    }
  }

  let autoActiveFlag = false;
  function autospinRunning() { return autoActiveFlag && state.autospinLeft > 0; }

  async function runFreeSpinsSession(initialSpins) {
    state.mode = "freespins";
    state.freeSpinsLeft = initialSpins;
    state.freeSpinsTotalWin = 0;
    updateHUD();

    while (state.freeSpinsLeft > 0) {
      state.freeSpinsLeft--;
      updateHUD();
      await sleep(360);
      await runSingleFreeSpin();
      await sleep(state.speedMode === 2 ? 240 : 620);
    }

    const totalFS = state.freeSpinsTotalWin;
    state.mode = "main";
    updateHUD();
    SoundFX.winBig();
    await showSplash("FREE SPINS COMPLETE", "TOTAL FEATURE WIN", fmtMoney(totalFS), 3000);
    winTicker.innerHTML = `<span class="win-pill">FREE SPINS WIN: ${fmtMoney(totalFS)}</span>`;
  }

  async function runSingleFreeSpin() {
    const bet = currentBet();
    state.spinning = true;
    clearWinHighlights();
    winTicker.innerHTML = "";
    btnSpin.classList.add("spinning");
    SoundFX.spinStart();

    const newGrid = generateSpinGrid("freespins", bet);
    state.grid = newGrid;

    const baseDelay = state.speedMode === 2 ? 120 : state.speedMode === 1 ? 210 : 400;
    const colStagger = state.speedMode === 2 ? 28 : state.speedMode === 1 ? 55 : 110;

    reelColEls.forEach(col => {
      col.classList.remove("landed");
      col.classList.add("spinning");
    });
    await sleep(baseDelay);

    for (let c = 0; c < COLS; c++) {
      reelColEls[c].classList.remove("spinning");
      for (let r = 0; r < ROWS; r++) renderCell(c, r, newGrid[c][r]);
      reelColEls[c].classList.add("landed");
      SoundFX.reelStop(c);
      if (c < COLS - 1) await sleep(colStagger);
    }
    btnSpin.classList.remove("spinning");

    const evalRes = evaluateSpin(newGrid, bet);
    if (evalRes.totalWin > 0) {
      state.balance = roundMoney(state.balance + evalRes.totalWin);
      state.freeSpinsTotalWin = roundMoney(state.freeSpinsTotalWin + evalRes.totalWin);
      showWinHighlights(evalRes);
      winTicker.innerHTML = `<span class="win-pill">FREE SPIN WIN: ${fmtMoney(evalRes.totalWin)}</span>`;
      SoundFX.winSmall();
    }
    logHistory("Free Spin", 0, evalRes.totalWin);

    if (evalRes.bonusCount >= 8) {
      SoundFX.featureTrigger();
      await showSplash("BONUS GAME!", `${evalRes.bonusCount} BONUS COINS`, "3 RESPINS AWARDED", 2200);
      const bWin = await runBonusGame(newGrid, bet);
      state.freeSpinsTotalWin = roundMoney(state.freeSpinsTotalWin + bWin);
      // Restore Free Spins mode banner
      state.mode = "freespins";
      updateHUD();
    }

    const sc = Math.min(5, evalRes.scatterCount);
    if (sc >= 2) {
      const extra = FREE_SPINS_RETRIGGER[sc];
      state.freeSpinsLeft += extra;
      SoundFX.featureTrigger();
      winTicker.innerHTML = `<span class="win-pill">+${extra} EXTRA FREE SPINS!</span>`;
      updateHUD();
      await sleep(950);
    }

    state.spinning = false;
    updateHUD();
  }

  async function runBonusGame(triggerGrid, bet) {
    const prevMode = state.mode;
    state.mode = "bonus";
    state.bonusRespinsLeft = 3;
    clearWinHighlights();

    // Lock all bonus coins from triggering grid
    const bGrid = Array.from({ length: COLS }, (_, c) =>
      Array.from({ length: ROWS }, (_, r) =>
        triggerGrid[c][r].id === "bonus" ? { ...triggerGrid[c][r] } : null
      )
    );
    state.bonusGrid = bGrid;
    renderBonusGrid(bGrid);
    updateHUD();

    let lockedCount = 0;
    for (let c = 0; c < COLS; c++) for (let r = 0; r < ROWS; r++) if (bGrid[c][r]) lockedCount++;

    while (state.bonusRespinsLeft > 0 && lockedCount < 20) {
      await sleep(state.speedMode === 2 ? 300 : 650);
      state.bonusRespinsLeft--;
      updateHUD();

      // Spin empty cells
      for (let c = 0; c < COLS; c++) {
        for (let r = 0; r < ROWS; r++) {
          if (!bGrid[c][r]) cellEls[c][r].classList.add("respin-spinning");
        }
      }
      SoundFX.spinStart();
      await sleep(state.speedMode === 2 ? 240 : 520);

      let landedNew = false;
      for (let c = 0; c < COLS; c++) {
        for (let r = 0; r < ROWS; r++) {
          cellEls[c][r].classList.remove("respin-spinning");
          if (!bGrid[c][r] && Math.random() < 0.24) {
            bGrid[c][r] = { id: "bonus", mult: 0, ...makeCoinData(bet) };
            lockedCount++;
            landedNew = true;
            SoundFX.coinLand();
          }
        }
      }

      renderBonusGrid(bGrid);
      if (landedNew) {
        state.bonusRespinsLeft = 3;
        winTicker.innerHTML = `<span class="win-pill">COIN LOCKED! RESPINS RESET TO 3 (${lockedCount}/20)</span>`;
        updateHUD();
      }
    }

    // Sum up all coins
    let totalBonusWin = 0;
    for (let c = 0; c < COLS; c++) {
      for (let r = 0; r < ROWS; r++) {
        if (bGrid[c][r]) totalBonusWin = roundMoney(totalBonusWin + bGrid[c][r].coinVal);
      }
    }

    let subTitle = `${lockedCount}/20 BONUS COINS COLLECTED`;
    if (lockedCount === 20) {
      const grandVal = roundMoney(bet * JACKPOTS.GRAND);
      totalBonusWin = roundMoney(totalBonusWin + grandVal);
      subTitle = "FULL BOARD! GRAND JACKPOT WON!";
    }

    state.balance = roundMoney(state.balance + totalBonusWin);
    logHistory("Bonus Game", 0, totalBonusWin);
    state.mode = prevMode === "freespins" ? "freespins" : "main";
    updateHUD();

    SoundFX.winBig();
    await showSplash("BONUS GAME WIN!", subTitle, fmtMoney(totalBonusWin), 3200);
    winTicker.innerHTML = `<span class="win-pill">BONUS WIN: ${fmtMoney(totalBonusWin)}</span>`;
    return totalBonusWin;
  }

    if (state.history.length > 50) state.history.pop();
  }

        </div>
        <div class="rule-item">
          <div class="rule-glyph"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><polyline points="21 3 21 8 16 8"/><text x="12" y="15.5" text-anchor="middle" fill="currentColor" stroke="none" font-size="9.5" font-weight="900">A</text></svg></div>
          <div class="rule-text"><h4>Autospin</h4><p>Click Autospin to automatically play a selected number of spins.</p></div>
        </div>
      </div>
    `;
  }

  function buildHistoryHTML() {
    if (state.history.length === 0) {
      return `<div class="menu-card"><p style="text-align:center;padding:24px 0;">No spins recorded in this session yet. Press Spin to play!</p></div>`;
    }
    const rows = state.history.map(h => `
      <div class="history-row">
        <div>
          <div style="color:#fff;font-weight:700;">${h.type}</div>
          <div style="color:#7e8ca3;font-size:11px;">${h.time} • Bet: ${fmtMoney(h.bet)}</div>
        </div>
        <div class="${h.win > 0 ? "hist-win" : "hist-loss"}">${h.win > 0 ? "+" + fmtMoney(h.win) : fmtMoney(0)}</div>
      </div>
    `).join("");
    return `<div class="menu-section-title">SESSION SPINS</div><div class="menu-card">${rows}</div>`;
  }

  function buildSettingsHTML() {
    return `
      <div class="menu-section-title">GAME SETTINGS</div>
      <div class="menu-card">
        <div class="setting-row">
          <div>
            <div style="font-weight:700;font-size:14px;">Sound Effects</div>
            <div style="font-size:12px;color:#8c9bb3;">Synthesized reel & win audio</div>
          </div>
          <button class="toggle-btn ${state.soundOn ? "on" : ""}" id="setSoundToggle"></button>
        </div>
        <div class="setting-row">
          <div>
            <div style="font-weight:700;font-size:14px;">Spin Speed</div>
            <div style="font-size:12px;color:#8c9bb3;">Choose reel stop timing</div>
          </div>
          <div class="speed-seg">
            <button data-sp="0" class="${state.speedMode === 0 ? "selected" : ""}">Normal</button>
            <button data-sp="1" class="${state.speedMode === 1 ? "selected" : ""}">Turbo</button>
            <button data-sp="2" class="${state.speedMode === 2 ? "selected" : ""}">Extra</button>
          </div>
        </div>
        <div class="setting-row">
          <div>
            <div style="font-weight:700;font-size:14px;">Demo Balance</div>
            <div style="font-size:12px;color:#8c9bb3;">Top up back to DEMO 100,000.00</div>
          </div>
          <button class="menu-action-btn" id="btnResetDemo">Reset Balance</button>
        </div>
      </div>
    `;
  }

  function bindSettingsEvents() {
    document.getElementById("setSoundToggle").addEventListener("click", (e) => {
      state.soundOn = !state.soundOn;
      e.currentTarget.classList.toggle("on", state.soundOn);
      updateSoundIcon();
      SoundFX.click();
    });

    document.querySelectorAll(".speed-seg button").forEach(btn => {
      btn.addEventListener("click", () => {
        state.speedMode = Number(btn.dataset.sp);
        updateHUD();
        renderMenuTab();
        SoundFX.click();
      });
    });

    document.getElementById("btnResetDemo").addEventListener("click", () => {
      state.balance = 100000.00;
      updateHUD();
      SoundFX.winSmall();
    });
  }

  /* =========================================================================
     13. DIALOG MODALS (BONUS BUY & AUTOSPIN)
     ========================================================================= */
  function openBonusBuyDialog() {
    if (state.spinning || state.mode !== "main") return;
    SoundFX.click();
    const bet = currentBet();
    const fsCost = roundMoney(bet * 100);
    const bgCost = roundMoney(bet * 80);

    dialogBox.innerHTML = `
      <div class="dialog-head">
        <h3>Bonus Buy</h3>
        <button class="dialog-close" id="dlgClose">&times;</button>
      </div>
      <div class="buy-option">
        <div>
          <h4>Buy Free Spins</h4>
          <p>Guarantees 3+ Scatters (8, 12 or 20 Free Spins with x2/x3 Wilds)</p>
        </div>
        <button class="buy-btn" id="buyFSBtn" ${state.balance < fsCost ? "disabled" : ""}>${fmtMoney(fsCost)}</button>
      </div>
      <div class="buy-option">
        <div>
          <h4>Buy Bonus Game</h4>
          <p>Guarantees 8+ Bonus Coins to trigger Hold & Win Respins</p>
        </div>
        <button class="buy-btn" id="buyBGBtn" ${state.balance < bgCost ? "disabled" : ""}>${fmtMoney(bgCost)}</button>
      </div>
    `;
    dialogBackdrop.classList.add("active");

    document.getElementById("dlgClose").onclick = closeDialog;
    document.getElementById("buyFSBtn").onclick = () => {
      if (state.balance < fsCost) return;
      state.balance = roundMoney(state.balance - fsCost);
      closeDialog();
      closeMenu();
      logHistory("Bonus Buy (FS)", fsCost, 0);
      runSpin("freespins");
    };
    document.getElementById("buyBGBtn").onclick = () => {
      if (state.balance < bgCost) return;
      state.balance = roundMoney(state.balance - bgCost);
      closeDialog();
      closeMenu();
      logHistory("Bonus Buy (Coins)", bgCost, 0);
      runSpin("bonus");
    };
  }

  function openAutospinDialog() {
    if (state.mode !== "main") return;
    SoundFX.click();
    if (state.autospinLeft > 0) {
      state.autospinLeft = 0;
      autoActiveFlag = false;
      updateHUD();
      return;
    }

    dialogBox.innerHTML = `
      <div class="dialog-head">
        <h3>Autospin</h3>
        <button class="dialog-close" id="dlgClose">&times;</button>
      </div>
      <p style="margin:0 0 10px;font-size:12.5px;color:#9eb0c7;">Select number of automatic spins at current bet (${fmtMoney(currentBet())}):</p>
      <div class="auto-grid">
        <button class="auto-count-btn" data-n="10">10 Spins</button>
        <button class="auto-count-btn" data-n="25">25 Spins</button>
        <button class="auto-count-btn" data-n="50">50 Spins</button>
        <button class="auto-count-btn" data-n="100">100 Spins</button>
      </div>
    `;
    dialogBackdrop.classList.add("active");
    document.getElementById("dlgClose").onclick = closeDialog;
    dialogBox.querySelectorAll(".auto-count-btn").forEach(btn => {
      btn.onclick = () => {
        const n = Number(btn.dataset.n);
        closeDialog();
        state.autospinLeft = n;
        autoActiveFlag = true;
        updateHUD();
        if (!state.spinning) {
          state.autospinLeft--;
          updateHUD();
          runSpin();
        }
      };
    });
  }

  function closeDialog() {
    dialogBackdrop.classList.remove("active");
  }

  dialogBackdrop.addEventListener("click", (e) => {
    if (e.target === dialogBackdrop) closeDialog();
  });

  /* =========================================================================
     14. EVENT BINDINGS & HOLD-FOR-TURBO
     ========================================================================= */
  function updateSoundIcon() {
    const svg = document.getElementById("soundIconSvg");
    if (state.soundOn) {
      svg.innerHTML = `<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>`;
    } else {
      svg.innerHTML = `<path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>`;
    }
  }

  let spinHoldTimer = null;
  let spinHeldFired = false;

  btnSpin.addEventListener("pointerdown", () => {
    if (state.autospinLeft > 0) return;
    spinHeldFired = false;
    spinHoldTimer = setTimeout(() => {
      spinHeldFired = true;
      if (!state.spinning && state.mode === "main") runSpin(null, true);
    }, 360);
  });

  btnSpin.addEventListener("pointerup", () => {
    clearTimeout(spinHoldTimer);
    if (state.autospinLeft > 0) {
      state.autospinLeft = 0;
      autoActiveFlag = false;
      updateHUD();
      return;
    }
    if (!spinHeldFired && !state.spinning && state.mode === "main") {
      runSpin(null, false);
    }
  });
  btnSpin.addEventListener("pointerleave", () => clearTimeout(spinHoldTimer));

  btnSpeed.addEventListener("click", () => {
    SoundFX.click();
    state.speedMode = (state.speedMode + 1) % 3;
    updateHUD();
  });

  btnAutospin.addEventListener("click", openAutospinDialog);
  btnBonusBuy.addEventListener("click", openBonusBuyDialog);

  btnBetDec.addEventListener("click", () => {
    if (state.betIndex > 0 && !state.spinning && state.mode === "main") {
      SoundFX.click();
      state.betIndex--;
      updateHUD();
    }
  });
  btnBetInc.addEventListener("click", () => {
    if (state.betIndex < BET_STEPS.length - 1 && !state.spinning && state.mode === "main") {
      SoundFX.click();
      state.betIndex++;
      updateHUD();
    }
  });

  document.getElementById("btnSound").addEventListener("click", () => {
    state.soundOn = !state.soundOn;
    updateSoundIcon();
    if (state.soundOn) SoundFX.click();
  });

  document.getElementById("btnMenu").addEventListener("click", () => openMenu("paytable"));
  document.getElementById("btnMenuClose").addEventListener("click", closeMenu);

  document.querySelectorAll(".menu-nav-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const tab = btn.dataset.tab;
      if (tab === "home") {
        closeMenu();
      } else if (tab === "bonusbuy") {
        closeMenu();
        openBonusBuyDialog();
      } else {
        SoundFX.click();
        state.activeMenuTab = tab;
        renderMenuTab();
      }
    });
  });

  // Keyboard support (Space to spin)
  window.addEventListener("keydown", (e) => {
    if (e.code === "Space" && !menuOverlay.classList.contains("active") && !dialogBackdrop.classList.contains("active")) {
      e.preventDefault();
      if (splashResolve) splashResolve();
      else if (!state.spinning && state.mode === "main") runSpin();
    }
  });

  // Live Clock
  function updateClock() {
    const d = new Date();
    const str = d.toTimeString().slice(0, 5);
    document.getElementById("liveClock").textContent = str;
    document.getElementById("menuClock").textContent = str;
  }

  /* =========================================================================
     15. INITIALIZE BOARD
     ========================================================================= */
  buildBoardDOM();
  state.grid = generateSpinGrid("main", currentBet());
  renderGrid(state.grid);
  updateHUD();
  updateSoundIcon();
  updateClock();
  setInterval(updateClock, 15000);
})();
</script>
</body>
</html>
