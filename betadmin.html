<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Hulu Bet · Command Center 2026</title>
  <style>
    :root{
      --bg:#080c12;--bg2:#0e141e;--card:#131b27;--card2:#192333;--tx:#edf2f7;--mu:#8a99ad;
      --bd:#222e40;--bd2:#2e3d54;--ac:#10b981;--ac2:#059669;--rd:#ef4444;--am:#f59e0b;
      --bl:#3b82f6;--cy:#06b6d4;--pu:#8b5cf6;--sh:0 12px 32px rgba(0,0,0,.38);--r:14px
    }
    @media(prefers-color-scheme:light){
      :root{
        --bg:#f1f5f9;--bg2:#e2e8f0;--card:#ffffff;--card2:#f8fafc;--tx:#0f172a;--mu:#64748b;
        --bd:#e2e8f0;--bd2:#cbd5e1;--ac:#059669;--ac2:#047857;--rd:#dc2626;--am:#d97706;
        --bl:#2563eb;--cy:#0891b2;--pu:#7c3aed;--sh:0 8px 24px rgba(15,23,42,.08)
      }
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 'Inter',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
    .tabular{font-variant-numeric:tabular-nums}

    /* Login Shell */
    .auth-shell{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(ellipse at top,rgba(16,185,129,.12),transparent 55%),var(--bg)}
    #login{width:100%;max-width:400px;background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:22px;box-shadow:var(--sh)}
    .brand-head{display:flex;align-items:center;gap:12px;margin-bottom:16px}
    .brand-logo{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,#10b981,#047857);display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 8px 20px rgba(16,185,129,.25)}
    .brand-head h2{margin:0;font-size:18px;font-weight:800;letter-spacing:-.02em}
    .brand-head small{display:block;color:var(--mu);font-size:12px;margin-top:2px}
    .role-tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:4px;margin-bottom:14px}
    .role-tab{border:0;background:transparent;color:var(--mu);padding:9px 8px;border-radius:9px;font-weight:700;font-size:12.5px;cursor:pointer;transition:.18s}
    .role-tab.on{background:var(--card2);color:var(--tx);box-shadow:0 2px 8px rgba(0,0,0,.22);border:1px solid var(--bd2)}
    .role-tab.on.agent{color:var(--am)}
    .role-tab.on.admin{color:var(--ac)}

    .pin-wrap{position:relative;display:flex;align-items:center;margin:4px 0 8px}
    .pin-wrap input{margin:0;padding-right:84px}
    .pin-actions{position:absolute;right:6px;display:flex;gap:4px}
    .pin-ico{border:0;background:var(--bd);color:var(--tx);border-radius:7px;min-width:32px;height:32px;cursor:pointer;font-size:13px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
    .pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0 12px}
    .pin-key{border:1px solid var(--bd);background:var(--bg2);color:var(--tx);border-radius:10px;min-height:42px;font-size:16px;font-weight:700;cursor:pointer}
    .pin-key:active{background:var(--bd)}
    .pin-key.fn{font-size:12.5px;color:var(--mu)}

    /* App Shell */
    .shell{display:none;min-height:100vh}
    .topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 16px;background:rgba(19,27,39,.88);backdrop-filter:blur(14px);border-bottom:1px solid var(--bd)}
    @media(prefers-color-scheme:light){.topbar{background:rgba(255,255,255,.9)}}
    .topbar h1{font-size:16px;font-weight:800;margin:0;flex:1;display:flex;align-items:center;gap:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .layout{display:flex;min-height:calc(100vh - 54px)}
    .sidebar{display:none;width:240px;flex-shrink:0;background:var(--card);border-right:1px solid var(--bd);padding:14px 10px;flex-direction:column;gap:4px;position:sticky;top:54px;height:calc(100vh - 54px);overflow-y:auto}
    .side-btn{width:100%;display:flex;align-items:center;gap:10px;padding:10px 12px;border:0;border-radius:11px;background:transparent;color:var(--mu);font-size:13px;font-weight:600;cursor:pointer;text-align:left;transition:.15s}
    .side-btn:hover{background:var(--card2);color:var(--tx)}
    .side-btn.on{background:rgba(16,185,129,.14);color:var(--ac);font-weight:800;border:1px solid rgba(16,185,129,.28)}
    .side-btn .ico{font-size:17px;width:22px;text-align:center}
    .side-btn .cnt{margin-left:auto;background:var(--rd);color:#fff;font-size:10.5px;font-weight:800;padding:1px 7px;border-radius:999px}
    .content{flex:1;min-width:0;padding:16px;max-width:1360px;margin:0 auto;padding-bottom:92px}
    nav.mob-dock{position:fixed;bottom:0;left:0;right:0;display:flex;overflow-x:auto;background:var(--card);border-top:1px solid var(--bd);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:22}
    nav.mob-dock button{flex:1;min-width:68px;border:0;background:none;color:var(--mu);font-size:10px;font-weight:600;padding:4px;cursor:pointer;position:relative}
    nav.mob-dock button span{display:block;font-size:19px}
    nav.mob-dock button.on{color:var(--ac);font-weight:800}
    nav.mob-dock i{position:absolute;top:0;right:12px;background:var(--rd);color:#fff;font-style:normal;font-size:10px;font-weight:800;border-radius:9px;padding:0 5px}
    @media(min-width:960px){
      .sidebar{display:flex}
      nav.mob-dock{display:none}
      .content{padding:20px 24px 36px}
    }

    /* Cards, Grids, Tables */
    .g{display:grid;gap:12px;grid-template-columns:repeat(2,1fr);margin-bottom:14px}
    @media(min-width:720px){.g{grid-template-columns:repeat(4,1fr)}}
    .g2cols{display:grid;gap:12px;grid-template-columns:1fr;margin-bottom:14px}
    @media(min-width:860px){.g2cols{grid-template-columns:1.25fr 1fr}}
    .c{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:14px;margin-bottom:14px;box-shadow:0 2px 10px rgba(0,0,0,.12)}
    .g .c{margin:0}
    .kpi{position:relative;overflow:hidden}
    .kpi .k{color:var(--mu);font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
    .kpi .v{font-size:21px;font-weight:800;margin-top:4px;font-variant-numeric:tabular-nums}
    .kpi .sub{font-size:11.5px;color:var(--mu);margin-top:2px}
    h2{font-size:15.5px;font-weight:800;margin:0 0 10px;letter-spacing:-.01em}
    h3{font-size:13.5px;font-weight:700;margin:0 0 8px}
    .k{color:var(--mu);font-size:12px}

    .tw{overflow-x:auto}
    table{border-collapse:collapse;width:100%}
    th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--bd);white-space:nowrap;font-size:13px}
    th{color:var(--mu);font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}

    .b{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;background:var(--bd)}
    .ok{background:rgba(16,185,129,.16);color:var(--ac)}
    .no{background:rgba(239,68,68,.16);color:var(--rd)}
    .wa{background:rgba(245,158,11,.16);color:var(--am)}
    .in{background:rgba(59,130,246,.16);color:var(--bl)}
    .pu{background:rgba(139,92,246,.18);color:var(--pu)}

    button.a{border:0;border-radius:9px;padding:7px 12px;margin:2px;cursor:pointer;color:#fff;background:var(--bl);font-size:12.5px;font-weight:700;display:inline-flex;align-items:center;gap:5px}
    button.a.g2{background:var(--ac)}
    button.a.r{background:var(--rd)}
    button.a.am{background:var(--am);color:#0f172a}
    button.a.m{background:var(--card2);color:var(--tx);border:1px solid var(--bd2)}
    button.a:disabled{opacity:.5;cursor:not-allowed}

    input,select,textarea{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--bd2);border-radius:10px;padding:10px 12px;font:inherit;font-size:14.5px;margin:4px 0 9px;outline:none}
    input:focus,select:focus,textarea:focus{border-color:var(--ac)}
    .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
    .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:10px}
    .toolbar input,.toolbar select{width:auto;min-width:160px;margin:0;padding:8px 10px;font-size:13px}
    .li{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:9px 0;border-bottom:1px solid var(--bd)}
    .li:last-child{border-bottom:0}
    .bar{height:8px;background:var(--bg2);border-radius:999px;margin:5px 0 11px;overflow:hidden}
    .bar i{display:block;height:8px;border-radius:999px;background:var(--ac)}
    code{font-family:ui-monospace,monospace;background:var(--bg2);padding:2px 6px;border-radius:6px;word-break:break-all;font-size:12px}
    .quick-strip{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
    .range-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:10px 12px;margin-bottom:12px}
    .range-pills{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
    .range-chip{border:1px solid var(--bd2);background:var(--bg2);color:var(--mu);border-radius:9px;padding:6px 10px;font-size:12px;font-weight:700;cursor:pointer;transition:.15s}
    .range-chip:hover{color:var(--tx);border-color:var(--ac)}
    .range-chip.on{background:var(--ac);color:#04130b;border-color:var(--ac);font-weight:800}
    .scroll-box{max-height:360px;overflow:auto;border:1px solid var(--bd);border-radius:10px}
    .scroll-box table th{position:sticky;top:0;background:var(--card);z-index:2}
    .scroll-box table th,.scroll-box table td{padding:7px 6px;font-size:12px}
    .scroll-box button.a{padding:5px 8px;font-size:11.5px;margin:1px}

    /* Modals & Toasts */
    #md{position:fixed;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;z-index:40;padding:16px}
    #md>div{background:var(--card);border:1px solid var(--bd2);border-radius:16px;padding:18px;width:100%;max-width:440px;max-height:90vh;overflow:auto;box-shadow:var(--sh)}
    #ts{position:fixed;top:64px;left:50%;transform:translateX(-50%);background:var(--ac);color:#fff;padding:10px 18px;border-radius:999px;display:none;z-index:50;max-width:92%;text-align:center;font-weight:700;font-size:13px;box-shadow:var(--sh)}
    #ts.err{background:var(--rd)}

    @media(max-width:700px){
      table{min-width:0}
      tr.h{display:none}
      tr{display:block;border:1px solid var(--bd);border-radius:12px;margin-bottom:10px;padding:8px 12px;background:var(--card2)}
      td{display:flex;justify-content:space-between;align-items:center;gap:10px;border:0;padding:5px 0;white-space:normal;text-align:right;flex-wrap:wrap}
      td::before{content:attr(data-l);color:var(--mu);font-size:11.5px;font-weight:700;text-align:left}
    }
  </style>
</head>
<body>

<div class="auth-shell" id="authShell">
  <div id="login">
    <div class="brand-head">
      <div class="brand-logo">🦁</div>
      <div>
        <h2>Hulu Bet Control 2026</h2>
        <small>Master Admin &amp; Withdrawal Agent Portal</small>
      </div>
    </div>

    <div class="role-tabs" role="tablist">
      <button type="button" class="role-tab admin on" id="tabAdminRole" data-role="admin">👑 Master Admin</button>
      <button type="button" class="role-tab agent" id="tabAgentRole" data-role="agent">💸 Withdrawal Agent</button>
    </div>

    <div id="agentSetupBox" style="display:none;background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.35);border-radius:12px;padding:12px;margin-bottom:12px">
      <div style="font-weight:800;font-size:13px;color:var(--am);margin-bottom:4px">First-Time Withdrawal Agent Setup</div>
      <p class="k" style="margin:0 0 8px">No Withdrawal Agent PIN is configured yet. Create a dedicated PIN for withdrawal-only agents (different from Master Admin PIN).</p>
      <input id="setupAgentPin1" type="password" placeholder="New Agent PIN (4+ chars)">
      <input id="setupAgentPin2" type="password" placeholder="Confirm Agent PIN">
      <button type="button" class="a am" style="width:100%;justify-content:center;min-height:40px" id="btnSetupAgentPin">Save Agent PIN &amp; Sign In</button>
    </div>

    <label class="k" id="lnameLbl">Operator name (logged in audit trail)</label>
    <input id="lname" placeholder="e.g. Aymen / Cashier1" autocomplete="off">

    <label class="k" id="lpinLbl">Master Admin PIN (numbers or text)</label>
    <div class="pin-wrap">
      <input id="lpin" type="password" inputmode="text" placeholder="Enter Master Admin PIN" autocomplete="current-password">
      <div class="pin-actions">
        <button type="button" class="pin-ico" id="ltoggle" title="Show/Hide PIN" aria-label="Show or hide PIN">👁</button>
        <button type="button" class="pin-ico" id="lclear" title="Clear PIN" aria-label="Clear PIN">✕</button>
      </div>
    </div>

    <div class="pin-pad" id="lpad" aria-label="PIN Keypad">
      <button type="button" class="pin-key" data-k="1">1</button>
      <button type="button" class="pin-key" data-k="2">2</button>
      <button type="button" class="pin-key" data-k="3">3</button>
      <button type="button" class="pin-key" data-k="4">4</button>
      <button type="button" class="pin-key" data-k="5">5</button>
      <button type="button" class="pin-key" data-k="6">6</button>
      <button type="button" class="pin-key" data-k="7">7</button>
      <button type="button" class="pin-key" data-k="8">8</button>
      <button type="button" class="pin-key" data-k="9">9</button>
      <button type="button" class="pin-key fn" data-k="clear">Clear</button>
      <button type="button" class="pin-key" data-k="0">0</button>
      <button type="button" class="pin-key fn" data-k="bksp">⌫</button>
    </div>

    <button class="a g2" style="width:100%;min-height:44px;justify-content:center;font-size:14px" id="lbtn">Sign in</button>
    <p class="k" id="lerr" style="color:var(--rd);min-height:18px;margin:8px 0 0"></p>
  </div>
</div>

<div class="shell" id="app">
  <header class="topbar">
    <h1>🦁 <span id="topTitle">Hulu Bet Admin</span> <span class="b ok" id="roleBadge">Master Admin</span></h1>
    <span class="b in" id="upd">…</span>
    <button class="a m" data-act="refresh" title="Refresh data">⟳ Refresh</button>
    <button class="a r" data-act="logout">Exit</button>
  </header>
  <div class="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="content" id="v"></main>
  </div>
  <nav class="mob-dock" id="nav"></nav>
</div>

<div id="md"><div id="mb"></div></div>
<div id="ts"></div>

<script>
const API = (() => {
  try {
    const q = new URLSearchParams(location.search).get('api');
    if (q && /^https?:\/\//i.test(q)) return q.replace(/\/+$/, '');
  } catch (_) {}
  if (location.hostname.endsWith('.github.io')) return 'https://hulubetserver.app.aletcloud.com';
  return window.location.origin;
})();

const pathLow = location.pathname.toLowerCase();
const urlMode = new URLSearchParams(location.search).get('mode');
let LOGIN_MODE = (pathLow.includes('/agent') || urlMode === 'agent') ? 'agent' : 'admin';

let PIN = '', ACTOR = 'Admin', ROLE = 'admin';
let D = null, AG = null, U = null, SQ = '', AL = [], BOT = null, SM = null, FR = null;
let page = 'Overview', prev = { d: 0, w: 0 };
let adminRange = 'all', userListQ = '', selectedBetUser = 'ALL', betListQ = '';
let wdFilterQ = '', wdFilterMethod = 'ALL', depFilterQ = '', depFilterMethod = 'ALL', userStatusFilter = 'ALL', betGameFilter = 'ALL', auditFilterQ = '', smsFilterQ = '';

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const etb = n => Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' ETB';
const ago = ts => { const s = (Date.now() - new Date(ts)) / 1000; return s < 60 ? 'now' : s < 3600 ? Math.floor(s / 60) + 'm' : s < 86400 ? Math.floor(s / 3600) + 'h' : Math.floor(s / 86400) + 'd'; };
const BC = { approved: 'ok', active: 'ok', won: 'ok', verified: 'ok', yes: 'ok', pending: 'wa', suspended: 'wa', rejected: 'no', banned: 'no', lost: 'no', no: 'm' };
const badge = (t, c) => `<span class="b ${c || BC[String(t).toLowerCase()] || ''}">${esc(t)}</span>`;
const btn = (l, act, data = {}, c = '') => `<button type="button" class="a ${c}" data-act="${act}" ${Object.entries(data).map(([k, v]) => `data-${k}="${esc(v)}"`).join(' ')}>${l}</button>`;
const tbl = (h, r) => `<div class="tw"><table><tr class="h">${h.map(x => `<th>${x}</th>`).join('')}</tr>${r.map(x => `<tr>${x.map((c, j) => `<td data-l="${h[j]}">${c}</td>`).join('')}</tr>`).join('')}</table></div>`;
const empty = t => `<p class="k">${t}</p>`;

function toast(m, err) {
  const t = $('#ts'); t.textContent = m; t.className = err ? 'err' : '';
  t.style.display = 'block'; clearTimeout(t.h);
  t.h = setTimeout(() => t.style.display = 'none', 3200);
}
function beep() {
  try {
    const a = new (window.AudioContext || window.webkitAudioContext)(), o = a.createOscillator(), g = a.createGain();
    o.frequency.value = 880; g.gain.value = .07; o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime + .22);
  } catch (_) {}
}
function downloadCsv(filename, headers, rows) {
  const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const csv = [headers.map(q).join(','), ...rows.map(r => r.map(q).join(','))].join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1500);
}

// ---------- Role Tabs & Setup ----------
function setLoginMode(mode) {
  LOGIN_MODE = mode === 'agent' ? 'agent' : 'admin';
  $('#tabAdminRole').classList.toggle('on', LOGIN_MODE === 'admin');
  $('#tabAgentRole').classList.toggle('on', LOGIN_MODE === 'agent');
  $('#lerr').textContent = '';
  if (LOGIN_MODE === 'agent') {
    $('#lpinLbl').textContent = 'Withdrawal Agent PIN';
    $('#lpin').placeholder = 'Enter Withdrawal Agent PIN';
    $('#lbtn').className = 'a am';
    $('#lbtn').textContent = 'Sign in as Withdrawal Agent';
    checkAgentPinStatus();
  } else {
    $('#agentSetupBox').style.display = 'none';
    $('#lpinLbl').textContent = 'Master Admin PIN (numbers or text)';
    $('#lpin').placeholder = 'Enter Master Admin PIN';
    $('#lbtn').className = 'a g2';
    $('#lbtn').textContent = 'Sign in as Master Admin';
  }
}
$('#tabAdminRole').onclick = () => setLoginMode('admin');
$('#tabAgentRole').onclick = () => setLoginMode('agent');

async function checkAgentPinStatus() {
  try {
    const r = await fetch(API + '/api/agent/pin-status');
    const d = await r.json();
    if (LOGIN_MODE === 'agent' && d.success && !d.configured) {
      $('#agentSetupBox').style.display = 'block';
    } else {
      $('#agentSetupBox').style.display = 'none';
    }
  } catch (_) {}
}

$('#btnSetupAgentPin').onclick = async () => {
  const p1 = $('#setupAgentPin1').value.trim();
  const p2 = $('#setupAgentPin2').value.trim();
  if (p1.length < 4) return $('#lerr').textContent = 'Agent PIN must be at least 4 characters';
  if (p1 !== p2) return $('#lerr').textContent = 'Agent PINs do not match';
  $('#btnSetupAgentPin').disabled = true;
  try {
    const r = await fetch(API + '/api/agent/setup-pin', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ pin: p1 })
    });
    const d = await r.json();
    if (!d.success) { $('#lerr').textContent = d.message || 'Setup failed'; return; }
    toast(d.message || 'Agent PIN configured');
    $('#agentSetupBox').style.display = 'none';
    $('#lpin').value = p1;
    await login();
  } catch (_) {
    $('#lerr').textContent = 'Network error configuring PIN';
  } finally {
    $('#btnSetupAgentPin').disabled = false;
  }
};

// ---------- API ----------
async function call(path, method = 'GET', body) {
  try {
    const headers = { 'Content-Type': 'application/json' };
    if (ROLE === 'agent' || path.startsWith('/api/agent/')) headers['x-agent-token'] = PIN;
    else headers['x-admin-token'] = PIN;
    const r = await fetch(API + path, {
      method, headers,
      body: body ? JSON.stringify({ ...body, actor: ACTOR }) : undefined
    });
    const d = await r.json().catch(() => ({ success: false, message: 'Bad response from server' }));
    if (r.status === 403 || r.status === 429) {
      if ((D || AG) && !path.startsWith('/api/auth/')) logout();
      d.auth = true;
    }
    return d;
  } catch (_) {
    return { success: false, message: 'Cannot reach server — try again in a few seconds' };
  }
}

async function load(silent) {
  if (ROLE === 'agent') {
    const d = await call('/api/agent/withdrawals');
    if (!d.success) { if (!silent) toast(d.message || 'Load failed', true); return d; }
    if (AG && d.pendingWithdrawals.length > prev.w) { beep(); toast('New withdrawal request received'); }
    prev.w = d.pendingWithdrawals.length;
    AG = d;
    $('#upd').textContent = 'Updated ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    if (!modalOpen()) R();
    return d;
  }
  const d = await call('/api/admin/master-dashboard?range=' + encodeURIComponent(adminRange || 'all'));
  if (!d.success) { if (!silent) toast(d.message || 'Load failed', true); return d; }
  if (D && (d.pendingDeposits.length > prev.d || d.pendingWithdrawals.length > prev.w)) { beep(); toast('New request received'); }
  prev = { d: d.pendingDeposits.length, w: d.pendingWithdrawals.length };
  D = d;
  if (SQ) await search(SQ, true);
  $('#upd').textContent = 'Updated ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  if (!modalOpen()) R();
  return d;
}

async function act(path, body) {
  const d = await call(path, 'POST', body);
  toast(d.message || (d.success ? 'Done' : 'Failed'), !d.success);
  if (d.success) {
    await load(true);
    if (ROLE === 'admin' && (page === 'Accounts & SMS' || path.includes('payment-accounts') || path.includes('owner-') || path.includes('sms-agents') || path.includes('match-withdrawal'))) {
      await loadFinance(true);
    }
  }
  return d;
}

// ---------- Login / Logout ----------
async function login() {
  PIN = $('#lpin').value.trim();
  const rawName = $('#lname').value.trim();
  if (!PIN) { $('#lerr').textContent = 'Enter your PIN'; $('#lpin').focus(); return; }
  $('#lbtn').disabled = true;
  $('#lerr').textContent = 'Verifying…';
  try {
    const res = await fetch(API + '/api/auth/admin-login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ pin: PIN, mode: LOGIN_MODE, actor: rawName || (LOGIN_MODE === 'agent' ? 'Cashier' : 'Admin') })
    });
    const authData = await res.json().catch(() => ({ success: false, message: 'Server error' }));
    if (!authData.success) {
      try { sessionStorage.removeItem('hb'); } catch (_) {}
      $('#lerr').textContent = authData.message || 'Invalid PIN';
      PIN = ''; $('#lpin').value = ''; $('#lpin').focus();
      return;
    }
    ROLE = authData.role;
    ACTOR = authData.actor || (ROLE === 'agent' ? 'Agent: Cashier' : 'Admin');
    page = ROLE === 'agent' ? 'AgentQueue' : 'Overview';

    const d = await load(true);
    if (d.success) {
      try { sessionStorage.setItem('hb', JSON.stringify({ PIN, ACTOR: rawName, ROLE, MODE: LOGIN_MODE })); } catch (_) {}
      $('#lerr').textContent = '';
      $('#authShell').style.display = 'none';
      $('#app').style.display = 'block';
      $('#topTitle').textContent = ROLE === 'agent' ? 'Withdrawal Agent Desk' : 'Hulu Bet Command 2026';
      $('#roleBadge').textContent = ROLE === 'agent' ? 'Withdrawals Only' : 'Master Admin';
      $('#roleBadge').className = 'b ' + (ROLE === 'agent' ? 'wa' : 'ok');
      R();
    } else {
      $('#lerr').textContent = d.message || 'Could not load dashboard';
      PIN = '';
    }
  } finally {
    $('#lbtn').disabled = false;
  }
}

function logout() {
  PIN = ''; D = null; AG = null; ROLE = LOGIN_MODE;
  try { sessionStorage.removeItem('hb'); } catch (_) {}
  $('#app').style.display = 'none';
  $('#authShell').style.display = 'flex';
  $('#lpin').value = '';
  $('#lerr').textContent = '';
}

$('#lbtn').onclick = login;
$('#lpin').onkeydown = e => { if (e.key === 'Enter') login(); };
$('#ltoggle').onclick = () => { const i = $('#lpin'); const show = i.type === 'password'; i.type = show ? 'text' : 'password'; $('#ltoggle').textContent = show ? '🙈' : '👁'; i.focus(); };
$('#lclear').onclick = () => { $('#lpin').value = ''; $('#lerr').textContent = ''; $('#lpin').focus(); };
$('#lpad').onclick = e => {
  const b = e.target.closest('[data-k]');
  if (!b) return;
  const k = b.dataset.k, inp = $('#lpin');
  if (k === 'clear') inp.value = '';
  else if (k === 'bksp') inp.value = inp.value.slice(0, -1);
  else inp.value = inp.value + k;
  inp.dispatchEvent(new Event('input', { bubbles: true }));
};

setLoginMode(LOGIN_MODE);
try {
  const s = JSON.parse(sessionStorage.getItem('hb') || 'null');
  if (s && s.PIN) {
    if (s.MODE) setLoginMode(s.MODE);
    $('#lpin').value = s.PIN;
    $('#lname').value = s.ACTOR || '';

} catch (_) {}

// ---------- Modal ----------
const modalOpen = () => $('#md').style.display === 'flex';
function closeM() { $('#md').style.display = 'none'; }
$('#md').onclick = e => { if (e.target.id === 'md') closeM(); };
function ask(title, fields, ok, label = 'Confirm') {
  $('#mb').innerHTML = `<h2>${esc(title)}</h2>${fields.map(f => `<label class="k">${esc(f.label)}</label>` + (f.type === 'select'
    ? `<select id="f_${f.k}">${f.options.map(o => `<option>${esc(o)}</option>`).join('')}</select>`
    : f.long ? `<textarea id="f_${f.k}" rows="3" placeholder="${esc(f.ph || '')}">${esc(f.value || '')}</textarea>`
    : `<input id="f_${f.k}" type="${f.type || 'text'}" value="${esc(f.value || '')}" placeholder="${esc(f.ph || '')}" inputmode="${f.type === 'number' ? 'decimal' : 'text'}">`)).join('')}
    <div class="row" style="margin-top:10px"><button type="button" class="a g2" id="mok">${esc(label)}</button><button type="button" class="a m" onclick="closeM()">Cancel</button></div>`;
  $('#md').style.display = 'flex';
  $('#mok').onclick = () => { const v = {}; fields.forEach(f => v[f.k] = $('#f_' + f.k).value.trim()); closeM(); ok(v); };
}
const sure = (title, text, ok) => {
  $('#mb').innerHTML = `<h2>${esc(title)}</h2><p class="k">${esc(text)}</p><div class="row" style="margin-top:12px"><button type="button" class="a g2" id="mok">Yes, continue</button><button type="button" class="a m" onclick="closeM()">Cancel</button></div>`;
  $('#md').style.display = 'flex';
  $('#mok').onclick = () => { closeM(); ok(); };
};

function filterPlayers(list, qText = '') {
  const q = String(qText || '').toLowerCase().trim();
  return (list || []).filter(u => {
    if (userStatusFilter === 'BONUS' && !(Number(u.bonus_balance || 0) > 0 || Number(u.wager_requirement_left || 0) > 0)) return false;
    if (userStatusFilter !== 'ALL' && userStatusFilter !== 'BONUS' && u.st !== userStatusFilter) return false;
    if (q && ![u.id, u.name, u.telegram_username, u.st].some(v => String(v || '').toLowerCase().includes(q))) return false;
    return true;
  });
}
const playersTable = (rawList, qText = '', opts = {}) => {
  const list = filterPlayers(rawList, qText);
  if (!list.length) return empty('No matching players found');
  const rangeMode = Boolean(opts.rangeMode);
  const cols = rangeMode
    ? ['ID', 'Player', 'Total Bal', 'Bonus (50x)', 'Bets', 'Wagered', 'Won', 'Net', 'Dep / Wd', 'Status', 'Actions']
    : ['ID', 'Player', 'Total Bal', 'Bonus (50x)', 'Wager Left', '1st Dep', 'Status', 'Wagered', 'Won', 'Actions'];
  const html = tbl(cols, list.map(u => {
    const uDisp = esc(u.name) + (u.telegram_username ? ` <span class="k">@${esc(u.telegram_username)}</span>` : '');
    const acts =

      btn('Top-up', 'topup', { id: u.id, name: u.name }, 'g2') +
      btn('Adjust', 'adj', { id: u.id, name: u.name }, 'm') +
      (!rangeMode ? (u.st === 'active'
        ? btn('Suspend', 'stat', { id: u.id, name: u.name, st: 'suspended' }, 'am') + btn('Ban', 'stat', { id: u.id, name: u.name, st: 'banned' }, 'r')
        : btn('Activate', 'stat', { id: u.id, name: u.name, st: 'active' }, 'g2')) : '');
    if (rangeMode) {
      const rNet = Number(u.rangeNet ?? (Number(u.rangeWon || 0) - Number(u.rangeWagered || 0)));
      return [
        `<span class="mono">${esc(u.id)}</span>`,
        uDisp,
        `<b>${etb(u.bal)}</b>`,
        `<span style="color:var(--am)">${etb(u.bonus_balance || 0)}</span>`,
        `<b>${Number(u.rangeBets ?? u.bets ?? 0)}</b>`,
        etb(u.rangeWagered ?? u.total_wagered),

        `<b style="color:${rNet >= 0 ? 'var(--ac)' : 'var(--rd)'}">${rNet >= 0 ? '+' : ''}${etb(rNet)}</b>`,
        `<span class="k">${etb(u.rangeDep ?? u.total_deposited)} / ${etb(u.rangeWd ?? 0)}</span>`,

      `<span class="mono">${esc(u.id)}</span>`,

      `<b>${etb(u.bal)}</b>`,
      `<span style="color:var(--am)">${etb(u.bonus_balance || 0)}</span>`,
      `<span class="k">${etb(u.wager_requirement_left || 0)}</span>`,

function renderRtpSvgChart(gs, defaultTarget) {
  if (!gs || !gs.length) return empty('No settled game volume yet');
  const maxW = Math.max(1, ...gs.map(g => Number(g.wagered || 0)));
  return gs.map(g => {
    const tRtp = g.targetRtp || defaultTarget;
    const dev = Math.abs(g.rtp - tRtp);
    const barColor = dev > 8 && g.wagered > 5000 ? 'var(--am)' : 'var(--ac)';
    const volPct = Math.max(4, Math.min(100, (g.wagered / maxW) * 100));
    return `<div style="margin-bottom:10px">
      <div class="li" style="border:0;padding:0">
        <span><b>${esc(g.game)}</b> <span class="k">${g.bets} bets · ${etb(g.wagered)} vol</span></span>
        <span><b>${g.rtp}%</b> <span class="k">/ ${tRtp}% target</span></span>
      </div>
      <div class="bar"><i style="width:${Math.min(100, g.rtp)}%;background:${barColor}"></i></div>
      <div style="height:4px;background:var(--bg2);border-radius:999px;margin-top:-7px;overflow:hidden"><span style="display:block;height:4px;width:${volPct}%;background:var(--bl);opacity:.55"></span></div>
    </div>`;
  }).join('');
}

function renderCashflowSvg(ggr, ngr, pwAmt) {
  const vals = [Math.max(0, ggr), Math.max(0, ngr), Math.max(0, pwAmt)];
  const mx = Math.max(100, ...vals);
  const labels = ['GGR Today', 'NGR Month', 'Pending WD'];
  const cols = ['#10b981', '#3b82f6', '#f59e0b'];
  const bars = vals.map((v, i) => {
    const h = Math.max(8, Math.round((v / mx) * 86));
    const x = 18 + i * 74;
    const y = 98 - h;
    return `<rect x="${x}" y="${y}" width="44" height="${h}" rx="7" fill="${cols[i]}" opacity="0.9"></rect>
      <text x="${x + 22}" y="114" fill="currentColor" font-size="10" text-anchor="middle" opacity="0.72">${labels[i]}</text>`;
  }).join('');
  return `<svg viewBox="0 0 240 122" style="width:100%;max-height:150px;display:block;color:var(--tx)">${bars}</svg>`;
}

  },
  Audit() {
    const q = auditFilterQ.toLowerCase();
    const list = AL.filter(a => !q || [a.actor, a.action, a.detail, a.ip].some(v => String(v || '').toLowerCase().includes(q)));
    return `<div class="c">
      <div class="toolbar">
        <h2 style="margin:0">Admin &amp; Agent Audit Trail</h2>
        <div class="row">
          <input placeholder="Filter actor, action, detail…" value="${esc(auditFilterQ)}" oninput="auditFilterQ=this.value;R()">
          ${btn('Export CSV', 'exportAudit', {}, 'm')}
        </div>
      </div>
      ${list.length ? tbl(['When', 'Actor', 'Action', 'Detail', 'IP'], list.map(a => [
        new Date(a.created_at).toLocaleString('en-GB', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' }),
        esc(a.actor), badge(a.action, String(a.action).includes('agent') ? 'wa' : 'in'), esc(a.detail), `<span class="mono">${esc(a.ip)}</span>`
      ])) : empty('No audit entries match')}
    </div>`;
  },
  '12h Audit'() {
    const st = D.retentionStats || { activeBetsInDb: 0, activeAuditLogsInDb: 0, archived12hReports: 0, retentionWindowHours: 12 };
    const reps = D.reports12h || [];
    return `<div class="g">
      <div class="c kpi"><div class="k">Active Bets (&lt;12h)</div><div class="v">${st.activeBetsInDb}</div></div>
      <div class="c kpi"><div class="k">Active Audit Logs (&lt;12h)</div><div class="v">${st.activeAuditLogsInDb}</div></div>
      <div class="c kpi"><div class="k">Archived 12h Reports</div><div class="v" style="color:var(--ac)">${st.archived12hReports}</div></div>
      <div class="c kpi"><div class="k">Retention Window</div><div class="v">${st.retentionWindowHours}h</div></div>
    </div>
    <div class="c"><div class="toolbar"><div><h2 style="margin:0">12-Hour Audit Rollup &amp; DB Cleanup</h2><p class="k" style="margin:4px 0 0">Summarizes settled bets &amp; audit logs &gt;12h per game and prunes expired rows.</p></div>${btn('Run 12h Audit &amp; Prune', 'runAudit12h', {}, 'g2')}</div></div>
    ${BOT ? `<div class="c"><h2>Telegram Bot Status</h2><div class="li"><span>Bot status</span>${badge(BOT.configured ? 'connected' : 'demo / no token', BOT.configured ? 'ok' : 'wa')}</div><div class="li"><span>Bot username</span><code>@${esc(BOT.botUsername)}</code></div><div class="li"><span>Mini App URL</span><code>${esc(BOT.webAppUrl)}</code></div></div>` : ''}
    <div class="c"><h2>Archived 12-Hour Game Reports (${reps.length})</h2>${reps.length ? tbl(['Period End', 'Game', 'Bets', 'Won / Lost', 'Wagered', 'Paid Out', 'Profit', 'RTP', 'Players'], reps.map(r => [
      new Date(r.periodEnd || r.createdAt).toLocaleString('en-GB', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' }),
      esc(r.game), r.bets, `${r.won} / ${r.lost}`, etb(r.wagered), etb(r.payout), etb(r.profit), badge(r.rtp + '%', 'in'), r.players
    ])) : empty('No 12-hour archived reports yet.')}</div>`;
  }
};

const ADMIN_NAV = [
  ['Overview', '📊'], ['Deposits', '📥'], ['Withdrawals', '💸'], ['Accounts & SMS', '🏦'], ['Players', '👥'],
  ['Bets', '🎲'], ['Sports', '⚽'], ['12h Audit', '🗄️'], ['Promo', '🎁'], ['Settings', '⚙️'], ['Audit', '🧾']
];
const AGENT_NAV = [
  ['AgentQueue', '💸', 'Pending Queue'],
  ['AgentHistory', '🧾', 'Withdrawal History']
];

function R() {
  const navItems = ROLE === 'agent' ? AGENT_NAV : ADMIN_NAV;
  if (ROLE === 'agent' && !AG) return;
  if (ROLE === 'admin' && !D) return;

  const cnt = ROLE === 'agent'
    ? { AgentQueue: AG.pendingWithdrawals.length }
    : { Deposits: D.pendingDeposits.length, Withdrawals: D.pendingWithdrawals.length };

  $('#nav').innerHTML = navItems.map(([k, i, lbl]) =>
    `<button type="button" class="${k === page ? 'on' : ''}" onclick="go('${k}')"><span>${i}</span>${esc(lbl || k)}${cnt[k] ? `<i>${cnt[k]}</i>` : ''}</button>`
  ).join('');

  $('#sidebar').innerHTML = navItems.map(([k, i, lbl]) =>
    `<button type="button" class="side-btn ${k === page ? 'on' : ''}" onclick="go('${k}')"><span class="ico">${i}</span><span>${esc(lbl || k)}</span>${cnt[k] ? `<span class="cnt">${cnt[k]}</span>` : ''}</button>`
  ).join('');

  if (V[page]) $('#v').innerHTML = V[page]();
}

async function go(p) {
  page = p; scrollTo(0, 0); R();
  if (ROLE !== 'admin') return;
  if (p === 'Audit') { const d = await call('/api/admin/audit'); AL = d.success ? d.log : []; R(); }
  if (p === 'Sports') { const d = await call('/api/admin/sports'); SM = d.success ? d.matches : []; R(); }
  if (p === 'Accounts & SMS') { await loadFinance(); }
  if (p === '12h Audit') {
    const [r12, botRes] = await Promise.all([
      call('/api/admin/reports-12h'),
      fetch(API + '/api/bot/status').then(r => r.json()).catch(() => null)
    ]);
    if (r12 && r12.success) { D.retentionStats = r12.retentionStats; D.reports12h = r12.reports; }
    if (botRes && botRes.success) BOT = botRes;
    R();
  }
}

setInterval(() => {
  if ((!D && !AG) || document.hidden || modalOpen()) return;
  if (ROLE === 'agent') { load(true); return; }
  if (['Overview', 'Deposits', 'Withdrawals', 'Bets'].includes(page)) load(true);
  if (page === 'Accounts & SMS') loadFinance(true);
  if (page === 'Sports') call('/api/admin/sports').then(d => { if (d.success) { SM = d.matches; R(); } });
}, 15000);
</script>
</body>
</html>
